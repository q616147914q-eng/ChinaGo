  if(/hotel|check.?in|room|accommodation/.test(ql)) return ["🏨 Hotel problem","Open Talk for a check-in phrase, and use My China Card above to keep your hotel name and Chinese address ready to show."];
  if(/pay|alipay|wechat|payment|qr|card|cash/.test(ql)) return ["💳 Payment problem","Open Pay → follow the setup checklist → keep a physical card or cash backup if a mobile payment fails."];
  if(/chinese|say|phrase|language|speak|translate/.test(ql)) return ["🗣️ Language problem","Open Talk → describe what you need → create a phrase you can show to a local."];
  if(/train|railway|ticket|station/.test(ql)) return ["🚆 Train problem","Keep your passport and train number ready. Open Talk for a phrase such as “请问在哪里检票？” and confirm station details on the operator app."];
  if(/toilet|restroom|bathroom|washroom/.test(ql)) return ["🚻 Restroom problem","Open Talk and use “请问卫生间在哪里？” — Where is the restroom?"];
  if(/pharmacy|medicine|drug|chemist/.test(ql)) return ["💊 Pharmacy problem","Open Life for the pharmacy guide. Show the exact medicine name to a pharmacist; for urgent medical needs use Help."];
  if(/sim|esim|phone|mobile data|roaming/.test(ql)) return ["📶 SIM / eSIM problem","Open Life for the connectivity checklist and keep the phone number that can receive verification messages."];
  if(/delivery|meituan|package|courier/.test(ql)) return ["📦 Delivery problem","Open Life for delivery/courier guidance. Keep your hotel Chinese address ready in My China Card."];
  if(/help|police|doctor|hospital|emergency|lost passport/.test(ql)) return ["🆘 Need help","Open Help for emergency numbers and ready-to-show Chinese phrases."];
  return ["ChinaGo quick solve","Start with Food, Move, Talk, Pay or Life. If you describe the exact problem, ChinaGo can route it to the most relevant tool."];
}
function solveCommand(){
  const q=($("#commandInput")||{}).value?.trim();
  if(!q)return toast("Describe the problem first");
  const box=$("#commandAnswer");box.innerHTML='<div class="answerCard"><b>ChinaGo is working on it…</b>Finding the most practical next step.</div>';
  api("/api/chat",{method:"POST",body:JSON.stringify({message:q,context:{product:"ChinaGo Everyday China Companion",city:localStorage.getItem("cg_city")||"Beijing"}})})
  .then(d=>{box.innerHTML='<div class="answerCard"><b>Next steps</b>'+esc(d.answer||"Use one of the tools below.")+'</div>'})
  .catch(()=>{const [title,local]=localQuickSolve(q);box.innerHTML='<div class="answerCard"><b>'+title+'</b>'+esc(local)+'</div>'});
}
function installChinaGo(){
  if(window.__chinagoInstall){window.__chinagoInstall.prompt();window.__chinagoInstall=null}
  else toast("On mobile: browser menu → Add to Home Screen");
}

function toolHero(title,sub){return '<section class="toolHero"><div class="eyebrow">CHINAGO TOOL</div><h1>'+title+'</h1><p>'+sub+"</p></section>"}
function food(){const f=state.food;let dishes=DISHES.slice();if(f.region!=="all")dishes=dishes.filter(d=>d.region===f.region);if(f.cat!=="all")dishes=dishes.filter(d=>d.cat===f.cat);if(f.spice!=="any")dishes=dishes.filter(d=>d.spice<=Number(f.spice));if(f.avoid.trim())dishes=dishes.filter(d=>!d.contains.toLowerCase().includes(f.avoid.trim().toLowerCase()));const regions=["all",...REGIONS.map(r=>r.name)];const cats=["all",...Array.from(new Set(DISHES.map(d=>d.cat)))];return toolHero("🍜 Order Food","Explore regional Chinese dishes, filter by spice or ingredients, paste a menu, and create a Chinese order card.")+'<section class="panel"><div class="formGrid"><div class="field"><label>Region / cuisine</label><select onchange="state.food.region=this.value;render()">'+regions.map(x=>'<option value="'+esc(x)+'" '+(f.region===x?"selected":"")+'>'+esc(x==="all"?"All China":x)+'</option>').join("")+'</select></div><div class="field"><label>Dish category</label><select onchange="state.food.cat=this.value;render()">'+cats.map(x=>'<option value="'+esc(x)+'" '+(f.cat===x?"selected":"")+'>'+esc(x==="all"?"All categories":x)+'</option>').join("")+'</select></div><div class="field"><label>What do you avoid? (e.g. pork, peanuts, beef)</label><input value="'+esc(f.avoid)+'" oninput="state.food.avoid=this.value"/></div><div class="field"><label>Maximum spice</label><select onchange="state.food.spice=this.value;render()"><option value="any" '+(f.spice==="any"?"selected":"")+'>Any</option><option value="0" '+(f.spice==="0"?"selected":"")+'>No spice</option><option value="1" '+(f.spice==="1"?"selected":"")+'>Mild</option><option value="2" '+(f.spice==="2"?"selected":"")+'>Medium</option><option value="3" '+(f.spice==="3"?"selected":"")+'>Hot</option><option value="4" '+(f.spice==="4"?"selected":"")+'>Very hot</option><option value="5" '+(f.spice==="5"?"selected":"")+'>Extreme</option></select></div></div><div class="field" style="margin-top:12px"><label>Menu text (optional) — paste dish names here</label><textarea placeholder="宫保鸡丁\n麻婆豆腐\n清炒时蔬" oninput="state.food.text=this.value">'+esc(f.text)+'</textarea></div><div class="row" style="margin-top:10px"><button class="primary" onclick="analyzeFood()">Analyze menu</button><button class="primary ghost" onclick="showOrderCard()">Show my order card</button></div><div id="foodResult"></div></section><section class="section"><div class="sectionHead"><div><h2>China food map</h2><span class="muted">'+dishes.length+' dishes match · '+DISHES.length+' dishes in the starter library</span></div></div><div class="dishGrid">'+dishes.map(d=>'<div class="dish"><span class="tag">'+esc(d.region)+' · '+esc(d.cat)+'</span><b>'+esc(d.en)+'</b><span style="font-weight:750">'+esc(d.cn)+'</span><small>'+esc(d.taste)+' · Spice '+("🌶️".repeat(d.spice)||"none")+'</small><small>'+esc(d.good)+'</small><small class="'+(f.avoid&&d.contains.toLowerCase().includes(f.avoid.toLowerCase())?"danger":"")+'">Contains: '+esc(d.contains)+"</small></div>").join("")+"</div></section><section class="section"><div class="grid">'+REGIONS.slice(0,6).map(r=>'<div class="card"><span class="tag">'+esc(r.cn)+'</span><h3>'+esc(r.name)+'</h3><p>'+esc(r.focus)+'</p><p><b>Cities:</b> '+esc(r.cities)+'</p><p><b>Try:</b> '+esc(r.food)+'</p></div>').join("")+'</div></section>'}
function analyzeFood(){const text=state.food.text.trim();const lines=text?text.split(/\n|,/).map(x=>x.trim()).filter(Boolean):[];let found=lines.length?lines.map(line=>DISHES.find(d=>d.cn===line||d.en.toLowerCase()===line.toLowerCase())||{cn:line,en:"Unknown dish",taste:"Ask the restaurant",spice:0,contains:"unknown",good:"ChinaGo does not have enough information about this dish."}):DISHES.filter(d=>state.food.spice==="any"||d.spice<=Number(state.food.spice)).filter(d=>!state.food.avoid||!d.contains.toLowerCase().includes(state.food.avoid.toLowerCase())).slice(0,4);$("#foodResult").innerHTML='<div class="resultBox"><h3>What to order</h3><div class="dishGrid">'+found.map(d=>'<div class="dish"><b>'+esc(d.en)+" · "+esc(d.cn)+'</b><small>'+esc(d.taste)+' · Spice '+("🌶️".repeat(d.spice)||"none")+'</small><small>Contains: '+esc(d.contains)+"</small></div>").join("")+"</div></div>"}
function showOrderCard(){const items=DISHES.filter(d=>state.food.spice==="any"||d.spice<=Number(state.food.spice)).filter(d=>!state.food.avoid||!d.contains.toLowerCase().includes(state.food.avoid.toLowerCase())).slice(0,3);$("#foodResult").innerHTML='<div class="resultBox"><h3>Show this to the restaurant</h3><p>请给我以下菜品，谢谢：</p>'+items.map(d=>'<div class="phrase"><button class="copy" onclick="copyText(\''+d.cn+'\')">Copy</button><div class="cn">'+d.cn+'</div><div class="en">'+d.en+"</div></div>").join("")+'<div class="phrase"><div class="cn">不要太辣，谢谢。</div><div class="en">Please don\'t make it too spicy.</div></div></div>'}
function move(){const m=state.move;const cities=Array.from(new Set([...ROUTES.map(r=>r.city),...["Beijing","Shanghai","Guangzhou","Shenzhen","Xi-an","Chengdu","Chongqing","Xi'an","Luoyang","Zhengzhou","Hangzhou","Nanjing","Suzhou","Kunming","Dali","Lijiang","Guilin","Changsha","Harbin","Sanya","Urumqi"]]));const presets=ROUTES.filter(r=>r.city===m.city);return toolHero("🚇 Get Around","Use city-aware route starters, prepare Chinese destinations, or show a taxi driver exactly where you want to go.")+'<section class="panel"><div class="formGrid"><div class="field"><label>City</label><select onchange="state.move.city=this.value;render()">'+cities.map(c=>'<option '+(m.city===c?"selected":"")+'>'+esc(c)+'</option>').join('')+'</select></div><div class="field"><label>Mode</label><select onchange="state.move.mode=this.value;render()"><option value="metro" '+(m.mode==="metro"?"selected":"")+'>Metro / public transport</option><option value="taxi" '+(m.mode==="taxi"?"selected":"")+'>Taxi / ride-hailing</option><option value="walk" '+(m.mode==="walk"?"selected":"")+'>Walking</option></select></div><div class="field"><label>From</label><input placeholder="e.g. Beijing South Railway Station" value="'+esc(m.from)+'" oninput="state.move.from=this.value"/></div><div class="field"><label>To</label><input placeholder="e.g. Forbidden City" value="'+esc(m.to)+'" oninput="state.move.to=this.value"/></div></div><div class="row" style="margin-top:12px"><button class="primary" onclick="buildRoute()">Build route helper</button><button class="primary ghost" onclick="taxiCard()">Driver card</button></div><div id="moveResult"></div></section><section class="section"><div class="sectionHead"><div><h2>Popular route starters</h2><span class="muted">Tap one to fill From / To. Verify live service, fares and closures before travel.</span></div></div><div class="grid">'+presets.slice(0,6).map(r=>'<button class="card" style="text-align:left" onclick="state.move.from='+JSON.stringify(r.from).replace(/"/g,"&quot;")+';state.move.to='+JSON.stringify(r.to).replace(/"/g,"&quot;")+';render()"><span class="tag">'+esc(r.city)+'</span><h3>'+esc(r.from)+' → '+esc(r.to)+'</h3><p>'+esc(r.tip)+'</p></button>').join("")+'</div><div class="notice" style="margin-top:12px"><b>Important:</b> ChinaGo does not pretend this is a live transit feed. For exact departures, service changes, current fares and temporary closures, verify in the city/operator app.</div></section><section class="section"><div class="grid">'+REGIONS.slice(0,8).map(r=>'<div class="card"><span class="tag">'+esc(r.cn)+'</span><h3>'+esc(r.name)+'</h3><p>'+esc(r.focus)+'</p><p><b>Main cities:</b> '+esc(r.cities)+'</p></div>').join("")+'</div></section>'}
function buildRoute(){const m=state.move;if(!m.from||!m.to){toast("Enter both From and To");return}const mode=m.mode==="metro"?"Metro / public transport":m.mode==="taxi"?"Taxi / ride-hailing":"Walking";$("#moveResult").innerHTML=`<div class="resultBox"><h3>${esc(mode)} · ${esc(m.city)}</h3><div class="transportSteps"><div class="step"><div class="num">1</div><div><b>Start</b><span>${esc(m.from)}</span></div></div><div class="step"><div class="num">2</div><div><b>Tell a local</b><span>我想去“${esc(m.to)}”，请问怎么走？</span></div></div><div class="step"><div class="num">3</div><div><b>Destination</b><span>${esc(m.to)}</span></div></div></div><div class="row" style="margin-top:12px"><button class="primary" onclick="copyText(this.dataset.text)" data-text="${esc("我想去 "+m.to+"，请问怎么走？")}">Copy Chinese</button><a class="primary" style="text-decoration:none" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(m.to+" "+m.city)}">Open map search</a></div></div>`}
function taxiCard(){const m=state.move;if(!m.to){toast("Enter a destination");return}$("#moveResult").innerHTML='<div class="resultBox"><h3>📱 Show this to the driver</h3><div class="phrase"><button class="copy" onclick="copyText(\''+m.to+'\')">Copy</button><div class="cn">'+esc(m.to)+'</div><div class="en">Destination</div></div><div class="phrase"><div class="cn">请送我到这里，谢谢。</div><div class="en">Please take me here, thank you.</div></div><div class="phrase"><div class="cn">到了以后请提醒我。</div><div class="en">Please let me know when we arrive.</div></div></div>'}
function talk(){const p=PHRASES.filter(x=>x.cat===state.talkCat);return toolHero("🗣️ Say it in Chinese","Type what you need to say, or choose a ready-made situation. ChinaGo turns common travel needs into a phrase you can show.")+`<section class="panel"><div class="chips">${["taxi","food","transport","hotel","life","help"].map(c=>`<button class="chip ${state.talkCat===c?"on":""}" onclick="state.talkCat=&quot;${c}&quot;;render()">${c}</button>`).join("")}</div><div class="field" style="margin-top:13px"><label>What do you want to say?</label><textarea id="talkInput" placeholder="e.g. I do not eat pork and I want this dish without chili.">${esc(state.talkText)}</textarea></div><div class="row" style="margin-top:9px"><button class="primary" onclick="makePhrase()">Create phrase</button></div><div id="talkResult"></div></section><section class="section"><div class="sectionHead"><h2>Ready phrases</h2></div>${p.map(x=>`<div class="phrase"><button class="copy" onclick="copyText(this.dataset.text)" data-text="${esc(x.cn)}">Copy</button><b>${esc(x.title)}</b><div class="cn">${esc(x.cn)}</div><div class="en">${esc(x.en)}</div></div>`).join("")}</section>`}
function makePhrase(){const t=$("#talkInput").value.trim();state.talkText=t;if(!t){toast("Type what you want to say");return}let cn="请问，可以帮我一下吗？";if(/pork/i.test(t))cn="我不吃猪肉，请不要放猪肉。";else if(/spicy|chili|辣/i.test(t))cn="请不要放辣椒，不要辣。";else if(/allerg/i.test(t)&&/peanut/i.test(t))cn="我对花生过敏，这道菜里有花生吗？";else if(/restroom|toilet|bathroom/i.test(t))cn="请问卫生间在哪里？";else if(/taxi|driver/i.test(t))cn="请送我到这个地方，谢谢。";else if(/how much|price|cost/i.test(t))cn="这个多少钱？";else if(/help/i.test(t))cn="你好，我需要帮助。";else cn="你好，可以帮我一下吗？"+t;$("#talkResult").innerHTML='<div class="resultBox"><h3>Show this</h3><div class="phrase"><button class="copy" onclick="copyText(\''+cn+'\')">Copy</button><div class="cn">'+cn+'</div><div class="en">Best-effort travel phrase. For legal, medical or safety-critical meaning, confirm with a qualified person.</div></div></div>'}
function pay(){return toolHero("💳 Pay in China","A practical checklist for foreigners using mobile payments. ChinaGo explains the flow; it does not handle your card or payment credentials.")+'<section class="grid"><div class="card"><span class="tag">PRIMARY</span><h3>Alipay</h3><p>Install and register before you need to pay. Check whether your international card is supported and complete any verification the app requests.</p><button class="primary" onclick="showPay(\'alipay\')">Setup checklist</button></div><div class="card"><span class="tag">BACKUP</span><h3>WeChat Pay</h3><p>Keep a second payment route available. International-card features and limits can change, so verify the current rules inside the app.</p><button class="primary" onclick="showPay(\'wechat\')">Setup checklist</button></div><div class="card"><span class="tag">FALLBACK</span><h3>Card / Cash</h3><p>Keep a physical card and a small cash backup. Some merchants may support only particular payment methods.</p><button class="primary" onclick="showPay(\'backup\')">What to do</button></div></section><div id="payResult" class="section"></div><section class="section"><div class="notice">Never send ChinaGo your full card number, CVV, password or one-time verification code.</div></section>'}
function showPay(type){const data={alipay:["1. Install Alipay and register with your own phone number.","2. Add a supported international card in the payment/wallet area.","3. Complete identity verification if requested.","4. Test a small merchant payment before relying on it.","5. Keep WeChat Pay or another backup."],wechat:["1. Install WeChat and register.","2. Open the payment/wallet section.","3. Follow the current international-card verification flow.","4. Test a merchant payment.","5. Keep Alipay as a backup."],backup:["1. Keep one physical international card with you.","2. Carry a small amount of RMB cash for situations where digital payment is unavailable.","3. If a QR payment fails, ask: 可以刷卡吗？ (Can I pay by card?)","4. If needed, show: 可以用现金吗？ (Can I pay cash?)"]}[type];$("#payResult").innerHTML=`<div class="panel"><h3>${{alipay:"Alipay",wechat:"WeChat Pay",backup:"Backup payment"}[type]} checklist</h3><div class="transportSteps">${data.map((x,i)=>`<div class="step"><div class="num">${i+1}</div><div><span>${esc(x)}</span></div></div>`).join("")}</div></div>`}
function life(){return toolHero("📱 China Life","Practical mini-guides for the everyday problems that do not fit inside a travel itinerary.")+'<div class="lifeGrid">'+LIFE.map(x=>'<article class="lifeCard"><div class="big">'+x.icon+'</div><h3>'+x.title+'</h3><p>'+x.text+"</p></article>").join("")+'</div><section class="section"><div class="panel"><div class="sectionHead"><div><h2>Ask a current question</h2><span class="muted">Server mode can use the AI/live-search layer when configured.</span></div></div><div class="search"><input id="liveInput" placeholder="e.g. Can foreigners use this metro today?"/><button class="primary" onclick="liveSearch()">Search</button></div><div id="liveResult" class="liveResult"></div></div></section>'}
async function liveSearch(){const q=$("#liveInput").value.trim();if(!q)return toast("Enter a question");$("#liveResult").textContent="Checking…";try{const d=await api("/api/live-search",{method:"POST",body:JSON.stringify({query:q,location:"China"})});$("#liveResult").textContent=d.answer||"No answer";}catch(e){$("#liveResult").textContent=e.message}}
function help(){return toolHero("🆘 Need Help?","Keep these phrases ready. For an immediate emergency, contact the appropriate local emergency service or ask nearby staff for help.")+`<div class="grid">${[["110","Police","报警"],["120","Medical emergency","急救"],["119","Fire","火警"]].map(x=>`<div class="card"><span class="tag">EMERGENCY</span><h3>${x[0]} · ${x[1]}</h3><p>Chinese: <b>${x[2]}</b></p><button class="primary" onclick="copyText(this.dataset.text)" data-text="${x[0]}">Copy number</button></div>`).join("")}</div><section class="section"><div class="phrase"><button class="copy" onclick="copyText(this.dataset.text)" data-text="你好，我不会说中文，请帮帮我。">Copy</button><div class="cn">你好，我不会说中文，请帮帮我。</div><div class="en">Hello, I do not speak Chinese. Please help me.</div></div><div class="phrase"><button class="copy" onclick="copyText(this.dataset.text)" data-text="请帮我联系警察。">Copy</button><div class="cn">请帮我联系警察。</div><div class="en">Please help me contact the police.</div></div></section>`}
function more(){return toolHero("＋ More","Travel planning and booking remain available, but they are supporting features rather than the center of ChinaGo.")+'<div class="moreList"><div class="moreItem"><div><h3>✦ Trip Planner</h3><p>Build a multi-day China itinerary when you actually need one.</p></div><button class="primary" onclick="goPlan()">Open</button></div><div class="moreItem"><div><h3>🏨 Hotels</h3><p>Live hotel search is available when the Booking.com provider is connected.</p></div><button class="primary" onclick="hotelHelp()">Open</button></div><div class="moreItem"><div><h3>◌ AI Assistant</h3><p>Ask ChinaGo a practical China question.</p></div><button class="primary" onclick="goChat()">Open</button></div></div>'}
function goPlan(){toast("Trip Planner is retained as a secondary module. The new core tools are Food, Move, Talk, Pay and Life.")}
function hotelHelp(){toast("Hotel search requires a connected provider. Use the hotel/booking flow when credentials are configured.")}
function goChat(){const box='<section class="panel chat"><div class="messages" id="messages">'+state.chat.map(m=>'<div class="bubble '+m.role+'">'+esc(m.text)+'</div>').join("")+'</div><div class="chatBar"><input id="chatInput" placeholder="Ask about China…"/><button class="primary" onclick="sendChat()">Send</button></div></section>';app.innerHTML=nav()+'<main class="shell">'+toolHero("◌ ChinaGo Assistant","Practical China help. Current facts should be verified live.")+box+"</main>"+bottom();setTimeout(()=>$("#chatInput")?.focus(),50)}
async function sendChat(){const input=$("#chatInput");const q=input?.value.trim();if(!q||state.chatLoading)return;state.chat.push({role:"user",text:q});state.chatLoading=true;goChat();try{const d=await api("/api/chat",{method:"POST",body:JSON.stringify({message:q,context:{product:"ChinaGo Survival OS"}})});state.chat.push({role:"ai",text:d.answer||"I couldn't answer that."})}catch(e){state.chat.push({role:"ai",text:"I couldn't reach the assistant. Try one of the practical tools instead."})}state.chatLoading=false;goChat()}
async function api(path,opt={}){if(STATIC_MODE){if(path==="/api/chat")return {answer:"Offline ChinaGo mode: use the Food, Move, Talk, Pay and Life tools without a server. Current information needs server mode.",mode:"static"};if(path==="/api/live-search")return {answer:"Live search needs ChinaGo server mode.",mode:"static"};return {ok:true}}const r=await fetch(path,{headers:{"Content-Type":"application/json",...(opt.headers||{})},...opt});let d;try{d=await r.json()}catch{throw new Error("Server returned "+r.status)}if(!r.ok)throw new Error(d.error||"Request failed");return d}

if("serviceWorker" in navigator && location.protocol!=="file:"){window.addEventListener("load",()=>navigator.serviceWorker.register("/sw.js").catch(()=>{}));}
window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();window.__chinagoInstall=e;});
