<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<meta name="theme-color" content="#111111"/>
<meta name="description" content="ChinaGo — the easiest way for foreigners to travel in China"/>
<link rel="manifest" href="/manifest.json"/>
<title>ChinaGo — China Travel OS</title>
<style>
:root{--ink:#111;--muted:#737373;--paper:#f7f7f5;--card:#fff;--line:#e9e9e5;--accent:#e53935;--soft:#f0f0ec;--green:#157347}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
button,input,select,textarea{font:inherit}button{cursor:pointer}
.app{min-height:100vh}.shell{width:min(1180px,100% - 32px);margin:auto}
.top{height:72px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);background:#ffffffcc;backdrop-filter:blur(12px);position:sticky;top:0;z-index:10}
.brand{font-weight:900;letter-spacing:-.04em;font-size:24px}.brand span{color:var(--accent)}
.nav{display:flex;gap:6px}.nav button{border:0;background:transparent;padding:10px 12px;border-radius:12px;color:#666}.nav button.active{background:#111;color:#fff}
main{padding:30px 0 90px}.hero{display:grid;grid-template-columns:1.25fr .75fr;gap:22px;align-items:stretch}
.heroCard{background:#111;color:#fff;border-radius:28px;padding:34px;min-height:390px;display:flex;flex-direction:column;justify-content:space-between;overflow:hidden;position:relative}
.heroCard:after{content:"";position:absolute;width:330px;height:330px;border-radius:50%;right:-90px;top:-100px;background:radial-gradient(circle,#e53935 0,transparent 68%);opacity:.8}
.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:.14em;color:#aaa}.hero h1{font-size:clamp(42px,7vw,78px);line-height:.92;letter-spacing:-.065em;max-width:700px;margin:12px 0}.hero p{color:#bdbdbd;max-width:610px;font-size:17px;line-height:1.6;position:relative;z-index:2}
.cta{border:0;border-radius:14px;background:#fff;color:#111;padding:14px 18px;font-weight:800;position:relative;z-index:2;width:max-content}
.quick{display:grid;grid-template-columns:1fr 1fr;gap:12px}.quickCard{background:#fff;border:1px solid var(--line);border-radius:22px;padding:20px;min-height:188px}.quickCard h3{margin:7px 0;font-size:20px}.quickCard p{color:#777;line-height:1.5;font-size:14px}
.section{margin-top:34px}.sectionHead{display:flex;align-items:end;justify-content:space-between;gap:20px;margin-bottom:15px}.sectionHead h2{font-size:28px;letter-spacing:-.04em;margin:0}.muted{color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:18px}.cityCard{min-height:210px;display:flex;flex-direction:column;justify-content:space-between}.tag{display:inline-flex;background:var(--soft);border-radius:999px;padding:6px 9px;font-size:11px;margin:3px 3px 0 0;color:#555}.cityTitle{font-size:24px;font-weight:850;letter-spacing:-.04em}.zh{color:#999;font-weight:500}.card button,.primary{border:0;background:#111;color:#fff;border-radius:12px;padding:11px 14px;font-weight:750}.ghost{background:#fff!important;color:#111!important;border:1px solid var(--line)!important}
.panel{background:#fff;border:1px solid var(--line);border-radius:24px;padding:22px}.formGrid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.field label{display:block;font-size:12px;color:#777;margin-bottom:7px}.field input,.field select,.field textarea{width:100%;border:1px solid #ddd;border-radius:12px;padding:12px;background:#fff;outline:none}.field textarea{min-height:100px;resize:vertical}.checks{display:flex;flex-wrap:wrap;gap:8px}.check{border:1px solid #ddd;border-radius:999px;padding:9px 12px;background:#fff}.check.on{background:#111;color:#fff;border-color:#111}
.itinerary{margin-top:16px}.day{border-top:1px solid var(--line);padding:20px 0}.day:first-child{border-top:0}.dayTop{display:flex;justify-content:space-between;gap:12px}.day h3{margin:0;font-size:22px}.timeline{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}.slot{background:var(--soft);border-radius:14px;padding:13px}.slot b{font-size:11px;text-transform:uppercase;color:#777}.slot div{margin-top:5px;line-height:1.45}
.chat{display:flex;flex-direction:column;gap:12px;min-height:420px}.messages{display:flex;flex-direction:column;gap:10px;flex:1}.bubble{max-width:85%;padding:13px 15px;border-radius:17px;line-height:1.5}.bubble.user{align-self:flex-end;background:#111;color:#fff}.bubble.ai{align-self:flex-start;background:var(--soft)}.chatBar{display:flex;gap:8px}.chatBar input{flex:1;border:1px solid #ddd;border-radius:14px;padding:13px}
.search{display:flex;gap:8px}.search input{flex:1;border:1px solid #ddd;border-radius:14px;padding:13px}.result{border-top:1px solid var(--line);padding:14px 0;line-height:1.6}
.bottom{display:none}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#111;color:#fff;padding:10px 14px;border-radius:999px;font-size:13px;display:none;z-index:50}
@media(max-width:800px){.shell{width:min(100% - 20px,680px)}.top{height:62px}.nav{display:none}.hero{grid-template-columns:1fr}.heroCard{min-height:430px;padding:26px}.quick{grid-template-columns:1fr 1fr}.grid{grid-template-columns:1fr 1fr}.formGrid,.timeline{grid-template-columns:1fr}.bottom{display:flex;position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);z-index:20;justify-content:space-around;padding:8px 5px env(safe-area-inset-bottom)}.bottom button{border:0;background:transparent;color:#777;font-size:11px}.bottom button.active{color:#111;font-weight:800}}
@media(max-width:480px){.quick,.grid{grid-template-columns:1fr}.hero h1{font-size:49px}}

.authModal{position:fixed;inset:0;background:#0008;display:flex;align-items:center;justify-content:center;padding:20px;z-index:100}
.authBox{background:#fff;border-radius:24px;width:min(430px,100%);padding:24px;box-shadow:0 20px 70px #0003}
.authBox h2{margin:0 0 6px}.authBox input{width:100%;border:1px solid #ddd;border-radius:12px;padding:13px;margin:7px 0}
.profileGrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.profileBox{background:#f3f3ef;border-radius:16px;padding:14px}
.offerGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.offer{border:1px solid var(--line);border-radius:18px;padding:16px;background:#fff}.offer .price{font-size:20px;font-weight:850;margin:8px 0}
@media(max-width:800px){.offerGrid,.profileGrid{grid-template-columns:1fr}}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head>
<body>
<div id="app"></div><div id="toast" class="toast"></div>
<script>
const STATIC_MODE=location.protocol==="file:";
const STATIC_CITIES=[
 {slug:"beijing",name_en:"Beijing",name_zh:"北京",tagline:"Imperial history, modern China",tags:["history","food","first-trip"]},
 {slug:"xian",name_en:"Xi'an",name_zh:"西安",tagline:"Terracotta Warriors & Silk Road history",tags:["history","food","culture"]},
 {slug:"luoyang",name_en:"Luoyang",name_zh:"洛阳",tagline:"Grottoes, temples & ancient capitals",tags:["history","culture","food"]},
 {slug:"dengfeng",name_en:"Dengfeng",name_zh:"登封",tagline:"Shaolin & Chinese martial arts",tags:["kung-fu","culture","nature"]},
 {slug:"kaifeng",name_en:"Kaifeng",name_zh:"开封",tagline:"Song culture & night food",tags:["history","food"]},
 {slug:"zhengzhou",name_en:"Zhengzhou",name_zh:"郑州",tagline:"Gateway to Henan",tags:["gateway","food"]}
];
const STATIC_SURVIVAL=[
 {icon:"💳",title:"Paying in China",body:"Alipay and WeChat Pay are the two apps you should learn first. Link a supported international card before your trip and keep a backup payment method."},
 {icon:"🚄",title:"High-speed rail",body:"China's high-speed rail network is extensive. Keep your passport details consistent across your booking and travel documents."},
 {icon:"🚕",title:"Getting around",body:"Use official ride-hailing, taxi or metro options. Keep your destination in Chinese characters ready for drivers."},
 {icon:"🍜",title:"Ordering food",body:"Use photo menus or a translation tool. ChinaGo focuses on explaining dishes, spice level, ingredients and ordering phrases."},
 {icon:"📶",title:"Connectivity",body:"Check eSIM/roaming availability before departure. Some international services may be inaccessible from mainland China."},
 {icon:"🗣️",title:"Useful Chinese",body:"A few phrases go a long way: 你好 (hello), 谢谢 (thank you), 多少钱 (how much), 不辣 (not spicy)."}
];
const STATIC_EXPERIENCES=[
 {id:"shaolin-private",city:"Dengfeng",title:"Shaolin Temple & Kung Fu Day",summary:"English-friendly private day experience with Shaolin Temple and Kung Fu focus.",duration:"Full day",language:"English",booking_url:"#"},
 {id:"luoyang-grottoes",city:"Luoyang",title:"Longmen Grottoes Cultural Day",summary:"Private cultural day around Longmen Grottoes and Luoyang highlights.",duration:"Full day",language:"English",booking_url:"#"},
 {id:"zhengzhou-food",city:"Zhengzhou",title:"Henan Food Discovery",summary:"Local food-focused experience with practical ordering help and regional specialties.",duration:"3–4 hours",language:"English",booking_url:"#"}
];
const STATIC_OFFERS=[
 {id:"airport-transfer",category:"Airport transfer",title:"Private airport pickup",price_from:null,currency:"CNY",provider_name:"ChinaGo request desk",booking_url:"#"},
 {id:"private-driver",category:"Private driver",title:"Private driver for a China day trip",price_from:null,currency:"CNY",provider_name:"ChinaGo request desk",booking_url:"#"},
 {id:"custom-trip",category:"Custom trip",title:"English-language China trip planning",price_from:null,currency:"CNY",provider_name:"ChinaGo request desk",booking_url:"#"}
];
const state={tab:"home",cities:[],survival:[],experiences:[],offers:[],hotels:[],hotelQuery:null,hotelCity:null,hotelDetail:null,hotelFavorites:[],trip:null,savedTrips:[],favorites:[],orders:[],user:null,authMode:"signin",authMsg:"",chat:[{role:"ai",text:"Hi! I’m ChinaGo. Tell me where you want to go in China, your dates, budget, or what you’re worried about."}],loading:false,live:"",liveQuery:""};
try{state.trip=JSON.parse(localStorage.getItem("chinago_last_trip")||"null");}catch{}
const app=document.getElementById("app");
const $=s=>document.querySelector(s);
function staticFallbackItinerary({days=7,budget="mid-range",cities=[],interests=[],notes="",travelerCountry="",startDate=""}={}){const route=(Array.isArray(cities)?cities.filter(Boolean):[]);const places=route.length?route:STATIC_CITIES.slice(0,4).map(x=>x.name_en);const focus=interests.length?interests.join(", "):"history, food and culture";const templates=[["City orientation and a major landmark","Local Chinese lunch","Historic district or museum","Easy neighborhood dinner and evening walk","Use metro or official ride-hailing; keep the destination in Chinese."],["Signature attraction and photo stops","Try a regional specialty","Second major attraction","Night market or relaxed local area","Avoid overpacking the day; allow time for queues."],["Morning cultural site","Casual local restaurant","Neighborhood exploration","Free evening or optional show","Check attraction opening hours and tickets live."],["Slow morning and coffee","Regional food experience","Scenic or cultural activity","Pack for the next transfer","Confirm train/flight times live before departure."]];const n=Math.max(1,Math.min(Number(days)||7,21));const ds=Array.from({length:n},(_,i)=>{const t=templates[i%templates.length];return {day:i+1,city:places[i%places.length],morning:t[0],lunch:t[1],afternoon:t[2],evening:t[3],transport:t[4],tips:[`Focus: ${focus}`,budget==="luxury"?"Leave extra time for private transfers or upgraded experiences.":"Reserve extra time for transport and queues."]}});return {title:`${n}-day China trip`,summary:`A practical starter route for ${travelerCountry||"your trip"}, based on your selected cities and interests (${focus}). This local mode does not use live AI data.`,estimated_budget:budget,practical_notes:["Starter mode works directly from index.html and does not require a server or API key.","Check live transport, tickets, opening hours and current prices before each activity.",notes?`Special needs: ${notes}`:"Keep passport details consistent across transport and hotel bookings."],days:ds,_meta:{mode:"static",reason:"OPENED_FROM_INDEX"}}}
async function api(path,opt={}){
  if(STATIC_MODE){
    if(path==="/api/plan" && opt.method==="POST"){const body=JSON.parse(opt.body||"{}");return staticFallbackItinerary(body)}
    if(path==="/api/config")return {version:"9.2.0",supabase:{url:"",anonKey:""},features:{ai:false,database:false,liveSearch:false,bookingCom:false},ai:{configured:false,model:"gpt-5.6-luna",mode:"static"}};
    if(path==="/api/health")return {ok:true,service:"ChinaGo",version:"9.2.0",ai:{configured:false,model:"gpt-5.6-luna",mode:"static"},database:false,providers:{},bookingCom:{configured:false}};
    if(path==="/api/cities")return STATIC_CITIES;
    if(path==="/api/survival")return STATIC_SURVIVAL;
    if(path==="/api/experiences")return STATIC_EXPERIENCES;
    if(path==="/api/offers")return STATIC_OFFERS;
    if(path.startsWith("/api/events/"))return {ok:true,static:true};
    if(path==="/api/booking-leads")return {ok:true,static:true};
    if(path==="/api/trips" && opt.method==="POST")return {ok:true,static:true};
    if(path==="/api/trips")return [];
    throw new Error("This feature needs ChinaGo server mode. Open the Plan tab to use offline mode.");
  }
  const r=await fetch(path,{headers:{"Content-Type":"application/json",...(opt.headers||{})},...opt});
  let d; try{d=await r.json()}catch{throw new Error(`Server returned ${r.status}`)}
  if(!r.ok)throw new Error(d.error||"Request failed");return d
}
function toast(t){const e=$("#toast");e.textContent=t;e.style.display="block";setTimeout(()=>e.style.display="none",2600)}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
async function init(){state.cities=STATIC_CITIES;state.survival=STATIC_SURVIVAL;state.experiences=STATIC_EXPERIENCES;state.offers=STATIC_OFFERS;try{state.hotelFavorites=JSON.parse(localStorage.getItem("chinago_hotel_favorites")||"[]")}catch{state.hotelFavorites=[]}try{const [cities,survival,experiences,offers]=await Promise.all([api("/api/cities"),api("/api/survival"),api("/api/experiences"),api("/api/offers")]);if(Array.isArray(cities)&&cities.length)state.cities=cities;if(Array.isArray(survival)&&survival.length)state.survival=survival;if(Array.isArray(experiences)&&experiences.length)state.experiences=experiences;if(Array.isArray(offers)&&offers.length)state.offers=offers}catch(e){console.warn("ChinaGo bootstrap fallback:",e.message)}render()}
function nav(){return `<header class="top"><div class="shell" style="display:flex;align-items:center;justify-content:space-between;width:100%"><div class="brand">China<span>Go</span></div><nav class="nav">${["home","plan","hotels","explore","experiences","survival","assistant"].map(x=>`<button class="${state.tab===x?"active":""}" onclick="go('${x}')">${({home:"Home",plan:"Plan",hotels:"Hotels",explore:"Explore",experiences:"Experiences",survival:"Survival",assistant:"AI Assistant"})[x]}</button>`).join("")}</nav><button class="ghost" style="padding:9px 12px;border-radius:12px" onclick="state.user?go('account'):openAuth()">${state.user?"Account":"Sign in"}</button></div></header>`}
function bottom(){return `<div class="bottom">${["home","plan","hotels","explore","experiences","assistant","account"].map(x=>`<button class="${state.tab===x?"active":""}" onclick="go('${x}')">${({home:"⌂ Home",plan:"✦ Plan",hotels:"▣ Hotels",explore:"◉ Explore",experiences:"✧ Trips",assistant:"◌ AI",account:"◎ Me"})[x]}</button>`).join("")}</div>`}
function render(){app.innerHTML=nav()+`<main class="shell">${STATIC_MODE?`<div class="panel" style="margin-bottom:14px;background:#f7f4e8"><b>Offline demo mode</b><div class="muted" style="margin-top:4px">Opened directly from index.html. Trip planning works locally; live hotel search, AI chat and current-data search require server mode.</div></div>`:""}${state.tab==="home"?home():state.tab==="plan"?planner():state.tab==="hotels"?hotels():state.tab==="explore"?explore():state.tab==="experiences"?experiences():state.tab==="account"?account():state.tab==="survival"?survival():state.tab==="assistant"?assistant():saved()}</main>${bottom()}`}
function go(t){state.tab=t;render();window.scrollTo({top:0,behavior:"smooth"})}
function home(){return `<div class="hero"><section class="heroCard"><div><div class="eyebrow">CHINAGO · CHINA TRAVEL OS</div><h1>China, without the confusion.</h1><p>Tell ChinaGo your dates, budget and interests. Get a practical route, then connect the trip to hotels, experiences, transfers and local help.</p><div style="display:flex;gap:8px;flex-wrap:wrap;position:relative;z-index:2"><button class="cta" onclick="go('plan')">Plan My China Trip →</button><button class="cta" style="background:#222;color:#fff;border:1px solid #444" onclick="openLead('custom-trip','custom-trip')">Get a custom trip</button></div></div><div style="position:relative;z-index:2;margin-top:18px;font-size:12px;color:#aaa">English-first · Practical China help · Start free</div></section><section class="quick"><div class="quickCard" onclick="go('plan')"><div>✦</div><h3>Plan My China Trip</h3><p>Build a route around your days, cities, budget and interests.</p><button class="primary" style="margin-top:8px">Start planning →</button></div><div class="quickCard" onclick="go('experiences')"><div>◆</div><h3>Travel services</h3><p>Request English-friendly experiences, airport pickup, private drivers and custom planning.</p><button class="primary" style="margin-top:8px">See services →</button></div><div class="quickCard" onclick="go('hotels')"><div>▣</div><h3>Find a hotel</h3><p>Search Booking.com inventory when provider credentials are connected.</p><button class="primary ghost" style="margin-top:8px">Explore hotels →</button></div><div class="quickCard" onclick="go('assistant')"><div>◌</div><h3>Ask ChinaGo</h3><p>Get practical answers about transport, food, payments and daily travel.</p><button class="primary" style="margin-top:8px">Ask a question →</button></div></section></div>
<div class="section"><div class="sectionHead"><div><h2>Turn a plan into a real trip</h2><span class="muted">One flow from inspiration to practical help.</span></div></div><div class="grid"><div class="card"><span class="tag">01 · PLAN</span><h3>Build your itinerary</h3><p class="muted">Choose your dates, cities and interests. Save the route on your device even without an account.</p><button class="primary" onclick="go('plan')">Build itinerary</button></div><div class="card"><span class="tag">02 · BOOK</span><h3>Find what you need</h3><p class="muted">Check hotels and request airport transfers, drivers or local experiences.</p><button class="primary" onclick="go('experiences')">Explore services</button></div><div class="card"><span class="tag">03 · GO</span><h3>Use ChinaGo on the trip</h3><p class="muted">Keep survival tips, saved plans and China-specific practical guidance in one place.</p><button class="primary" onclick="go('survival')">China Survival</button></div></div></div>
<div class="section"><div class="sectionHead"><h2>Start with these cities</h2><span class="muted">Built for first-time visitors</span></div><div class="grid">${state.cities.slice(0,6).map(c=>`<div class="card cityCard"><div><div class="cityTitle">${esc(c.name_en)} <span class="zh">${esc(c.name_zh||"")}</span></div><p class="muted">${esc(c.tagline||"")}</p>${(c.tags||[]).map(t=>`<span class="tag">${esc(t)}</span>`).join("")}</div><button onclick="prefillCity('${esc(c.name_en)}')">Plan ${esc(c.name_en)}</button></div>`).join("")}</div></div>`}
function prefillCity(c){go("plan");setTimeout(()=>{const x=$("#cities");if(x)x.value=c},30)}
function planner(){return `<div class="sectionHead"><div><h2>Build your China trip</h2><div class="muted">A useful route first. Live facts can be checked separately.</div><div id="aiStatus" class="muted" style="margin-top:6px">Checking AI planner…</div></div></div><div class="panel"><div class="formGrid"><div class="field"><label>Trip length</label><select id="days"><option>5</option><option selected>7</option><option>10</option><option>14</option><option>21</option></select></div><div class="field"><label>Budget</label><select id="budget"><option>budget</option><option selected>mid-range</option><option>comfortable</option><option>luxury</option></select></div><div class="field"><label>Countries / starting point</label><input id="country" placeholder="e.g. UK, USA, Singapore"/></div><div class="field"><label>Preferred cities</label><input id="cities" placeholder="e.g. Beijing, Xi'an, Luoyang, Dengfeng"/></div><div class="field"><label>Start date (optional)</label><input id="startDate" type="date"/></div><div class="field"><label>Special needs</label><input id="notes" placeholder="diet, children, mobility, photography..."/></div></div><div style="margin:16px 0"><label class="muted" style="font-size:12px">Interests</label><div class="checks" id="interests">${["history","food","culture","kung-fu","nature","nightlife","shopping","family"].map(x=>`<button class="check" onclick="this.classList.toggle('on')">${x}</button>`).join("")}</div></div><button class="primary" onclick="makePlan()">Generate itinerary ✦</button></div>${state.loading?`<div class="panel" style="margin-top:15px">Building your route…</div>`:""}${state.trip?renderTrip():""}`}
function renderTrip(){const t=state.trip;return `<div class="panel itinerary"><div class="eyebrow">Your ChinaGo itinerary</div><h2>${esc(t.title)}</h2><p class="muted">${esc(t.summary)}</p><div class="tag">Estimated budget: ${esc(t.estimated_budget)}</div><div class="day">${(t.practical_notes||[]).map(x=>`<div>• ${esc(x)}</div>`).join("")}</div>${(t.days||[]).map(d=>`<div class="day"><div class="dayTop"><h3>Day ${d.day} · ${esc(d.city)}</h3></div><div class="timeline"><div class="slot"><b>Morning</b><div>${esc(d.morning)}</div></div><div class="slot"><b>Lunch</b><div>${esc(d.lunch)}</div></div><div class="slot"><b>Afternoon</b><div>${esc(d.afternoon)}</div></div><div class="slot"><b>Evening</b><div>${esc(d.evening)}</div></div></div><p class="muted">🚄 ${esc(d.transport)}</p>${(d.tips||[]).map(x=>`<span class="tag">${esc(x)}</span>`).join("")}</div>`).join("")}<button class="primary" onclick="saveTrip()">Save this trip</button></div>`}
async function makePlan(){state.loading=true;render();const interests=[...document.querySelectorAll("#interests .on")].map(x=>x.textContent);try{state.trip=await api("/api/plan",{method:"POST",body:JSON.stringify({days:Number($("#days").value),budget:$("#budget").value,cities:$("#cities").value.split(",").map(x=>x.trim()).filter(Boolean),interests,notes:$("#notes").value,travelerCountry:$("#country").value,startDate:$("#startDate").value})});toast(state.trip?._meta?.mode==="static"?"Trip ready (offline mode)":state.trip?._meta?.mode==="fallback"?"Trip ready (starter mode)":"Trip ready");}catch(e){toast(e.message||"Could not generate trip")}state.loading=false;render();loadPlannerAIStatus()}
async function loadPlannerAIStatus(){const el=document.getElementById("aiStatus");if(!el)return;if(STATIC_MODE){el.innerHTML=`○ Offline planner · works directly from index.html`;return}try{const h=await api("/api/health");el.innerHTML=h.ai?.configured?`✦ AI planner connected · ${esc(h.ai.model)}`:`○ AI planner not configured · ChinaGo will use starter itinerary mode`;}catch(e){el.textContent="Planner status unavailable"}}
function hotels(){const q=state.hotelQuery||{};return `<div class="sectionHead"><div><h2>Find a hotel in China</h2><div class="muted">Search live inventory when connected, or browse ChinaGo starter hotel guidance without an API connection.</div></div></div>${STATIC_MODE?`<div class="panel" style="background:#f7f4e8"><b>Hotel search is not connected in offline mode.</b><p class="muted" style="margin:6px 0 0">ChinaGo will show live Booking.com availability after partner credentials are connected. You can still use the trip planner and save your itinerary now.</p></div>`:""}<div class="panel"><div class="formGrid"><div class="field" style="position:relative"><label>Destination</label><input id="hotelCity" value="${esc(state.hotelCity?.name||"")}" placeholder="Beijing, Xi'an, Luoyang..." oninput="hotelCitySuggest()" autocomplete="off"/><div id="hotelSuggestions"></div></div><div class="field"><label>Check-in</label><input id="hotelIn" type="date" value="${esc(q.checkin||"")}"/></div><div class="field"><label>Check-out</label><input id="hotelOut" type="date" value="${esc(q.checkout||"")}"/></div><div class="field"><label>Adults</label><input id="hotelAdults" type="number" min="1" value="${esc(q.adults||2)}"/></div><div class="field"><label>Rooms</label><input id="hotelRooms" type="number" min="1" value="${esc(q.rooms||1)}"/></div><div class="field"><label>Preferences</label><input id="hotelQuery" placeholder="quiet, near metro, family-friendly..." value="${esc(q.search_query||"")}"/></div><div class="field"><label>Minimum price</label><input id="hotelMin" type="number" min="0" placeholder="Optional" value="${esc(q.min_price??"")}"/></div><div class="field"><label>Maximum price</label><input id="hotelMax" type="number" min="0" placeholder="Optional" value="${esc(q.max_price??"")}"/></div></div><div style="margin:14px 0;display:flex;gap:8px;flex-wrap:wrap"><button class="check ${q.free_cancellation?"on":""}" onclick="this.classList.toggle('on')">Free cancellation</button><select id="hotelSort" style="border:1px solid #ddd;border-radius:999px;padding:9px 12px"><option value="top_picks">Top picks</option><option value="price">Price</option><option value="review_score">Guest rating</option></select></div><button class="primary" onclick="searchHotelsLive()">Search live hotels →</button></div>${state.hotelDetail?hotelDetailView():state.hotelQuery?`<div class="section panel"><div style="display:flex;justify-content:space-between;align-items:center;gap:10px"><div class="eyebrow">${esc(state.hotels.length)} live results</div><button class="ghost" onclick="clearHotelSearch()">New search</button></div><div class="grid" style="margin-top:12px">${state.hotels.map((h,i)=>hotelCard(h,i)).join("")||`<p class="muted">No matching hotels were returned. Try a wider price range or a different destination.</p>`}</div></div>`:""}`}
function hotelCard(h,i){const fav=state.hotelFavorites.some(x=>String(x.accommodation_id)===String(h.id));return `<div class="card cityCard"><div><div class="eyebrow">${esc(h.provider||"booking_com")}</div><div class="cityTitle">${esc(h.title)}</div><p class="muted">${esc(h.location||state.hotelCity?.name||"")}</p>${h.rating?`<span class="tag">★ ${esc(h.rating)}</span>`:""}<span class="tag">${h.currency?esc(h.currency)+" ":""}${h.price_from!=null?esc(h.price_from):"Check price"}</span>${h.free_cancellation?`<span class="tag">Free cancellation</span>`:""}</div><div style="display:flex;gap:7px;flex-wrap:wrap"><button class="ghost" onclick="toggleHotelFavorite(${i})">${fav?"♥ Saved":"♡ Save"}</button><button class="primary" onclick="hotelDetails(${i})">View details →</button></div></div>`}
function hotelDetailView(){const d=state.hotelDetail||{};const photos=Array.isArray(d.photos)?d.photos.slice(0,6):[];const facilities=Array.isArray(d.facilities)?d.facilities.slice(0,18):[];return `<div class="section panel"><div style="display:flex;justify-content:space-between;gap:10px;align-items:flex-start"><div><div class="eyebrow">Hotel details</div><h2 style="margin:4px 0">${esc(d.name||d.title||"Accommodation")}</h2><p class="muted">${esc(d.location?.address||d.location?.city_name||state.hotelCity?.name||"")}</p></div><button class="ghost" onclick="closeHotelDetails()">Back to results</button></div>${photos.length?`<div class="grid" style="margin-top:14px">${photos.map(x=>`<img src="${esc(typeof x==='string'?x:x?.url||x?.large||x?.small||"")}" alt="" style="width:100%;height:150px;object-fit:cover;border-radius:16px" loading="lazy"/>`).join("")}</div>`:""}<div class="section"><p style="line-height:1.65">${esc(d.description||"Property details are supplied by Booking.com. Check the live rate and policies before booking.")}</p>${facilities.length?`<div>${facilities.map(x=>`<span class="tag">${esc(typeof x==='string'?x:x?.name||x?.title||x?.id||"")}</span>`).join("")}</div>`:""}</div><div class="section panel" style="background:var(--soft)"><b>Stay dates</b><p class="muted">${esc(state.hotelQuery?.checkin||"")} → ${esc(state.hotelQuery?.checkout||"")} · ${esc(state.hotelQuery?.adults||2)} adults · ${esc(state.hotelQuery?.rooms||1)} room(s)</p><button class="primary" onclick="hotelAvailability()">Check live availability →</button><button class="ghost" style="margin-left:6px" onclick="addHotelToTrip()">Add to my trip</button></div></div>`}
let hotelSuggestTimer;
function hotelCitySuggest(){if(STATIC_MODE){const box=$("#hotelSuggestions");if(box)box.innerHTML=`<div class="panel" style="margin-top:6px"><div class="muted">Live Booking.com destination lookup needs server mode.</div></div>`;return}clearTimeout(hotelSuggestTimer);const input=$("#hotelCity");const q=input?.value.trim()||"";state.hotelCity=null;if(q.length<3){const e=$("#hotelSuggestions");if(e)e.innerHTML="";return}hotelSuggestTimer=setTimeout(async()=>{try{const d=await api("/api/v9/hotels/booking-com/autocomplete",{method:"POST",headers:authHeaders(),body:JSON.stringify({query:q,country:"cn",language:"en-gb",types:["city"]})});const box=$("#hotelSuggestions");if(!box)return;box.innerHTML=`<div class="panel" style="position:absolute;left:0;right:0;top:67px;z-index:8;padding:8px;box-shadow:0 12px 35px #0002">${(d.items||[]).slice(0,6).map((x,i)=>`<button class="ghost" style="display:block;width:100%;text-align:left;margin:3px 0" onclick="selectHotelCity(${i})"><b>${esc(x.name||x.city_name)}</b><span class="muted"> · ${esc(x.country_name||"China")}</span></button>`).join("")||`<div class="muted" style="padding:8px">No destination found.</div>`}</div>`;window._hotelSuggestions=d.items||[]}catch(e){console.warn(e)}},280)}
function selectHotelCity(i){const x=(window._hotelSuggestions||[])[i];if(!x)return;state.hotelCity={id:x.city_id||x.id,name:x.name||x.city_name,coordinates:x.coordinates||null};const input=$("#hotelCity");if(input)input.value=state.hotelCity.name;const box=$("#hotelSuggestions");if(box)box.innerHTML=""}
async function searchHotelsLive(){if(STATIC_MODE)return toast("Live hotel search is not connected yet. Your trip planner works without an API key.");const city=state.hotelCity;const q={city_id:city?.id,checkin:$("#hotelIn").value,checkout:$("#hotelOut").value,adults:Math.max(1,Number($("#hotelAdults").value)||2),rooms:Math.max(1,Number($("#hotelRooms").value)||1),search_query:$("#hotelQuery").value.trim(),min_price:Number($("#hotelMin").value)||null,max_price:Number($("#hotelMax").value)||null,free_cancellation:$(".check.on")?.textContent.includes("Free"),sort_by:$("#hotelSort").value,booker_country:"gb",platform:"mobile",rows:20};if(!q.checkin||!q.checkout||!q.city_id)return toast("Choose a destination and enter check-in / check-out");if(q.checkout<=q.checkin)return toast("Check-out must be after check-in");try{const useSmart=Boolean(q.search_query)&&q.min_price==null&&q.max_price==null&&!q.free_cancellation&&(q.sort_by==="top_picks");const endpoint=useSmart?"/api/v8/hotels/booking-com/smart-search":"/api/v7/hotels/booking-com/search";const d=await api(endpoint,{method:"POST",headers:authHeaders(),body:JSON.stringify(q)});if(d.error)return toast(d.error);state.hotels=d.items||[];state.hotelQuery=q;state.hotelDetail=null;render()}catch(e){toast(e.message)}}
async function hotelDetails(i){const h=state.hotels[i];if(!h)return;try{const d=await api("/api/v9/hotels/booking-com/details",{method:"POST",headers:authHeaders(),body:JSON.stringify({accommodation_id:Number(h.id),language:"en-gb"})});if(d.error)return toast(d.error);state.hotelDetail=(d.data||[])[0]||{name:h.title,id:h.id,url:{web:h.booking_url,app:h.deep_link}};if(state.hotelDetail.name&&typeof state.hotelDetail.name==="object")state.hotelDetail.name=state.hotelDetail.name["en-gb"]||Object.values(state.hotelDetail.name)[0]||h.title;state.hotelDetail._result=h;render();window.scrollTo({top:0,behavior:"smooth"})}catch(e){toast(e.message)}}
async function hotelAvailability(){const d=state.hotelDetail, h=d?._result||{};if(!h.id)return;try{const payload={accommodation_id:Number(h.id),checkin:state.hotelQuery.checkin,checkout:state.hotelQuery.checkout,adults:state.hotelQuery.adults,rooms:state.hotelQuery.rooms,booker_country:state.hotelQuery.booker_country};const r=await api("/api/v8/hotels/booking-com/availability",{method:"POST",headers:authHeaders(),body:JSON.stringify(payload)});if(r.error)return toast(r.error);await api("/api/events/booking",{method:"POST",headers:authHeaders(),body:JSON.stringify({category:"hotel",external_url:h.booking_url||h.deep_link,event_type:"hotel_availability_check",metadata:{provider:h.provider,item_id:h.id}})});const url=d.url?.web||d.url?.app||h.booking_url||h.deep_link;if(url)window.open(url,"_blank","noopener,noreferrer");}catch(e){toast(e.message)}}
async function toggleHotelFavorite(i){const h=state.hotels[i];if(!h)return;const exists=state.hotelFavorites.find(x=>String(x.accommodation_id)===String(h.id));try{if(state.user){if(exists){await api("/api/hotel-favorites/"+encodeURIComponent(h.id),{method:"DELETE",headers:authHeaders()});state.hotelFavorites=state.hotelFavorites.filter(x=>String(x.accommodation_id)!==String(h.id))}else{const x=await api("/api/hotel-favorites",{method:"POST",headers:authHeaders(),body:JSON.stringify({accommodation_id:h.id,title:h.title,city_name:h.location,payload:h})});state.hotelFavorites.unshift(x)}}else{const key="chinago_hotel_favorites";let a=JSON.parse(localStorage.getItem(key)||"[]");if(exists)a=a.filter(x=>String(x.accommodation_id)!==String(h.id));else a.unshift({accommodation_id:String(h.id),title:h.title,city_name:h.location,payload:h});localStorage.setItem(key,JSON.stringify(a));state.hotelFavorites=a}render();toast(exists?"Removed from saved hotels":"Saved hotel")}catch(e){toast(e.message)}}
function addHotelToTrip(){const h=state.hotelDetail?._result||state.hotelDetail;if(!h)return;if(!state.trip){state.trip={title:"My China trip",summary:"Saved with ChinaGo",estimated_budget:"",practical_notes:[],days:[],hotel_stays:[]}}state.trip.hotel_stays=state.trip.hotel_stays||[];if(!state.trip.hotel_stays.some(x=>String(x.accommodation_id)===String(h.id)))state.trip.hotel_stays.push({accommodation_id:String(h.id),title:h.title||state.hotelDetail.name,city:state.hotelCity?.name||h.location,checkin:state.hotelQuery?.checkin,checkout:state.hotelQuery?.checkout,booking_url:state.hotelDetail?.url?.web||h.booking_url||h.deep_link});saveTrip();toast("Hotel added to your trip")}
function closeHotelDetails(){state.hotelDetail=null;render()}
function clearHotelSearch(){state.hotelQuery=null;state.hotels=[];state.hotelDetail=null;state.hotelCity=null;render()}
function explore(){return `<div class="sectionHead"><div><h2>Explore China</h2><div class="muted">A curated starting layer — not a booking catalog.</div></div></div><div class="grid">${state.cities.map(c=>`<div class="card cityCard"><div><div class="eyebrow">${esc(c.province_en||"China")}</div><div class="cityTitle">${esc(c.name_en)}</div><p>${esc(c.description||c.tagline||"")}</p>${(c.tags||[]).map(t=>`<span class="tag">${esc(t)}</span>`).join("")}</div><button onclick="cityLive('${esc(c.name_en)}')">Check current info →</button></div>`).join("")}</div><div class="section panel"><h3>Live China search</h3><div class="search"><input id="liveQ" placeholder="e.g. Shaolin Temple opening hours tomorrow"/><button class="primary" onclick="liveSearch()">Search</button></div>${state.live?`<div class="result"><div class="eyebrow">Current search · ${new Date().toLocaleString()}</div>${esc(state.live)}</div>`:""}</div>`}
function cityLive(c){go("explore");setTimeout(()=>{$("#liveQ").value=`What should a foreign visitor know right now about ${c}? opening hours, tickets, transport and practical tips`;liveSearch()},20)}
async function liveSearch(){const q=$("#liveQ").value.trim();if(!q)return;if(STATIC_MODE)return toast("Current-data search needs server mode");try{const d=await api("/api/live-search",{method:"POST",body:JSON.stringify({query:q,location:"China"})});state.live=d.answer;render()}catch(e){toast(e.message)}}
function experiences(){return `<div class="sectionHead"><div><h2>Local Experiences</h2><div class="muted">Human-led experiences are a core ChinaGo transaction layer.</div></div></div><div class="grid">${state.experiences.map(x=>`<div class="card cityCard"><div><div class="eyebrow">${esc(x.city||x.cities?.name_en||"China")}</div><div class="cityTitle">${esc(x.title)}</div><p class="muted">${esc(x.summary||"English-friendly local experience.")}</p><span class="tag">${esc(x.duration||"Flexible")}</span><span class="tag">${esc(x.language||"English")}</span></div><button onclick="bookClick('${esc(x.booking_url||"#")}','experience')">View experience →</button></div>`).join("")}</div><div class="section"><h3>Book around your trip</h3><div class="offerGrid">${state.offers.map(o=>`<div class="offer"><div class="eyebrow">${esc(o.category)}</div><b>${esc(o.title)}</b><div class="price">${o.price_from?esc(o.currency||"CNY")+" "+esc(o.price_from):"Check live price"}</div><div class="muted">${esc(o.provider_name||"ChinaGo partner")}</div><button class="primary" style="margin-top:10px" onclick="bookClick('${esc(o.booking_url||"#")}','${esc(o.category)}','${esc(o.id||"")}')">Check availability</button></div>`).join("")}</div></div>`}
function survival(){return `<div class="sectionHead"><div><h2>China Survival</h2><div class="muted">The stuff most generic travel apps bury.</div></div></div><div class="grid">${state.survival.map(x=>`<div class="card"><div style="font-size:28px">${x.icon}</div><h3>${esc(x.title)}</h3><p class="muted" style="line-height:1.6">${esc(x.body)}</p></div>`).join("")}</div>`}
function assistant(){return `<div class="sectionHead"><div><h2>Ask ChinaGo</h2><div class="muted">English-first answers for the awkward China questions.</div></div></div><div class="panel chat"><div class="messages">${state.chat.map(m=>`<div class="bubble ${m.role==="user"?"user":"ai"}">${esc(m.text).replace(/\\n/g,"<br>")}</div>`).join("")}</div><div class="chatBar"><input id="chatQ" placeholder="Ask anything about traveling in China…" onkeydown="if(event.key==='Enter')sendChat()"/><button class="primary" onclick="sendChat()">Send</button></div></div>`}
async function sendChat(){const i=$("#chatQ"),msg=i.value.trim();if(!msg)return;if(STATIC_MODE){state.chat.push({role:"ai",text:"Offline mode is active. Trip planning works locally, but AI Assistant requires server mode with an API connection."});render();return;}state.chat.push({role:"user",text:msg});i.value="";render();try{const d=await api("/api/chat",{method:"POST",body:JSON.stringify({message:msg,context:{trip:state.trip?.title||null}})});state.chat.push({role:"ai",text:d.answer})}catch(e){state.chat.push({role:"ai",text:e.message})}render()}
function saved(){return `<div class="sectionHead"><div><h2>My Trips</h2><div class="muted">Your latest plan is saved locally. An account adds cloud sync when Supabase is connected.</div></div></div>${state.trip?`<div class="panel"><h3>${esc(state.trip.title||"My China trip")}</h3><p class="muted">${esc(state.trip.summary||"Saved ChinaGo itinerary")}</p><button class="primary" onclick="go('plan')">Open planner</button></div>`:`<div class="panel"><p class="muted">No saved trip on this device yet.</p><button class="primary" onclick="go('plan')">Create my trip</button></div>`}`}
async function saveTrip(){
  if(!state.trip)return;
  localStorage.setItem("chinago_last_trip",JSON.stringify(state.trip));
  state.savedTrips=[state.trip,...state.savedTrips.filter(t=>t!==state.trip)];
  if(state.user){
    try{
      await api("/api/trips",{method:"POST",headers:{Authorization:"Bearer "+state.user.access_token},body:JSON.stringify({title:state.trip.title,payload:state.trip})});
      await loadAccountData();toast("Saved to your ChinaGo account");return;
    }catch(e){toast(e.message);return}
  }
  toast("Saved on this device — sign in to sync across devices");
}

function authHeaders(){return state.user?.access_token?{Authorization:"Bearer "+state.user.access_token}:{} }
function account(){if(!state.user)return `<div class="sectionHead"><div><h2>My ChinaGo</h2><div class="muted">Your device-saved trip remains available without an account.</div></div></div>${state.trip?`<div class="panel"><h3>Latest trip</h3><p>${esc(state.trip.title||"China trip")}</p><button class="primary" onclick="go('plan')">Open trip planner</button></div>`:""}<div class="panel"><button class="primary" onclick="openAuth()">Sign in / Create account</button></div>`;return `<div class="sectionHead"><div><h2>My ChinaGo</h2><div class="muted">${esc(state.user.email||"")}</div></div><button class="ghost" onclick="signOut()">Sign out</button></div><div class="profileGrid"><div class="profileBox"><b>${state.savedTrips.length}</b><div class="muted">Saved trips</div></div><div class="profileBox"><b>${state.favorites.length}</b><div class="muted">Favorites</div></div><div class="profileBox"><b>${state.orders.length}</b><div class="muted">Requests / orders</div></div></div><div class="section panel"><h3>Cloud trips</h3>${state.savedTrips.length?state.savedTrips.map(t=>`<div class="day"><b>${esc(t.title)}</b><div class="muted">${new Date(t.created_at).toLocaleDateString()}</div></div>`).join(""):"<p class=\"muted\">No cloud trips yet.</p>"}</div>${state.user.email&&String(window._isAdmin||false)==="true"?`<div class="section panel"><h3>Operations</h3><button class="primary" onclick="adminPage()">Open admin dashboard</button></div>`:""}`}
function openAuth(){document.body.insertAdjacentHTML("beforeend",`<div class="authModal" id="authModal"><div class="authBox"><h2>${state.authMode==="signin"?"Welcome back":"Create your ChinaGo account"}</h2><div class="muted">Email accounts are enough to start; Google can be enabled in Supabase.</div><input id="authEmail" type="email" placeholder="Email"/><input id="authPassword" type="password" placeholder="Password"/><button class="primary" style="width:100%;margin-top:8px" onclick="submitAuth()">${state.authMode==="signin"?"Sign in":"Create account"}</button><button class="ghost" style="width:100%;margin-top:8px" onclick="googleAuth()">Continue with Google</button><button class="ghost" style="width:100%;margin-top:8px" onclick="toggleAuthMode()">${state.authMode==="signin"?"Create an account":"I already have an account"}</button><button class="ghost" style="width:100%;margin-top:8px" onclick="document.getElementById('authModal').remove()">Cancel</button><div class="muted" style="margin-top:10px">${esc(state.authMsg||"")}</div></div></div>`)}
function toggleAuthMode(){state.authMode=state.authMode==="signin"?"signup":"signin";document.getElementById("authModal")?.remove();openAuth()}
async function submitAuth(){if(!window._supabase)return toast("Supabase is not configured");const email=$("#authEmail").value.trim(),password=$("#authPassword").value;if(!email||password.length<6)return toast("Enter an email and a password of at least 6 characters");const fn=state.authMode==="signin"?window._supabase.auth.signInWithPassword.bind(window._supabase):window._supabase.auth.signUp.bind(window._supabase);const {data,error}=await fn({email,password});if(error)return toast(error.message);document.getElementById("authModal")?.remove();if(data.session){state.user={...data.session.user,access_token:data.session.access_token};await loadAccountData();render();toast("Signed in")}else toast("Check your email to confirm the account")}
async function googleAuth(){if(!window._supabase)return toast("Supabase is not configured");const {error}=await window._supabase.auth.signInWithOAuth({provider:"google",options:{redirectTo:location.origin}});if(error)toast(error.message)}
async function loadAccountData(){if(!state.user)return;try{state.savedTrips=await api("/api/trips",{headers:authHeaders()});state.favorites=await api("/api/favorites",{headers:authHeaders()});state.orders=await api("/api/orders",{headers:authHeaders()});try{state.hotelFavorites=await api("/api/hotel-favorites",{headers:authHeaders()})}catch{state.hotelFavorites=JSON.parse(localStorage.getItem("chinago_hotel_favorites")||"[]")}const me=await api("/api/me",{headers:authHeaders()});try{await api("/api/admin/summary",{headers:authHeaders()});window._isAdmin=true}catch{window._isAdmin=false}}catch(e){console.warn(e)}}
async function signOut(){if(window._supabase)await window._supabase.auth.signOut();state.user=null;state.savedTrips=[];state.favorites=[];state.orders=[];go("home")}
async function bookClick(url,category,offer_id=null){try{await api("/api/events/booking",{method:"POST",headers:authHeaders(),body:JSON.stringify({offer_id,category,external_url:url,event_type:"click"})})}catch(e){} if(url&&url!=="#")window.open(url,"_blank","noopener,noreferrer");else openLead(category,offer_id)}
function openLead(category,offer_id){document.body.insertAdjacentHTML("beforeend",`<div class="authModal" id="leadModal"><div class="authBox"><h2>Request ${esc(category)}</h2><div class="muted">ChinaGo can collect your request and arrange the next step. This is a request, not a confirmed booking.</div><input id="leadName" placeholder="Name"/><input id="leadEmail" type="email" placeholder="Email" value="${esc(state.user?.email||"")}"/><input id="leadDate" type="date"/><input id="leadParty" type="number" min="1" placeholder="Travelers"/><button class="primary" style="width:100%;margin-top:8px" onclick="submitLead('${esc(category)}','${esc(offer_id||"")}')">Send request</button><button class="ghost" style="width:100%;margin-top:8px" onclick="document.getElementById('leadModal').remove()">Cancel</button></div></div>`)}
async function submitLead(category,offer_id){const lead={offer_id:offer_id||null,category,customer_name:$("#leadName").value.trim(),customer_email:$("#leadEmail").value.trim(),travel_date:$("#leadDate").value,party_size:Number($("#leadParty").value)||null,request_json:{source:"web"}};if(!lead.customer_name||!lead.customer_email)return toast("Please enter your name and email");try{await api("/api/booking-leads",{method:"POST",headers:authHeaders(),body:JSON.stringify(lead)});const local=JSON.parse(localStorage.getItem("chinago_leads")||"[]");local.unshift({...lead,created_at:new Date().toISOString()});localStorage.setItem("chinago_leads",JSON.stringify(local.slice(0,20)));document.getElementById("leadModal")?.remove();toast("Request received — availability, price and booking details still need to be confirmed")}catch(e){toast(e.message)}}
async function adminPage(){if(!state.user)return;const s=await api("/api/admin/summary",{headers:authHeaders()});const leads=await api("/api/admin/leads",{headers:authHeaders()});let health=[];try{health=await api("/api/providers/health",{headers:authHeaders()})}catch(e){}app.innerHTML=nav()+`<main class="shell"><div class="sectionHead"><div><h2>ChinaGo Operations</h2><div class="muted">Provider health, leads and conversion signals.</div></div><button class="ghost" onclick="go('account')">Back</button></div><div class="profileGrid"><div class="profileBox"><b>${s.leads?.total||0}</b><div class="muted">Booking leads</div></div><div class="profileBox"><b>${s.leads?.new||0}</b><div class="muted">New leads</div></div><div class="profileBox"><b>${s.events?.bookings||0}</b><div class="muted">Booking clicks</div></div><div class="profileBox"><b>${s.events?.searches||0}</b><div class="muted">Live searches</div></div></div><div class="section panel"><h3>Provider health</h3>${health.length?health.map(x=>`<span class="tag">${esc(x.provider)}: ${x.ok?"healthy":x.configured?"error":"not configured"}</span>`).join(""):Object.entries(s.providers||{}).map(([k,v])=>`<span class="tag">${k}: ${v?"configured":"not configured"}</span>`).join("")}</div><div class="section panel"><h3>Sales summary</h3>${(s.salesSummary||[]).map(x=>`<div class="day"><b>${esc(x.category)}</b> · ${esc(x.status)} · ${x.orders} orders · ${esc(x.currency||"")} ${Number(x.gross_amount||0).toFixed(2)} gross</div>`).join("")||"<p class=muted>No order data yet.</p>"}</div><div class="section panel"><h3>Latest leads</h3>${leads.map(l=>`<div class="day"><b>${esc(l.category)}</b> · ${esc(l.customer_name||"Anonymous")} · ${esc(l.customer_email||"")}<div class="muted">Status: ${esc(l.status)} · ${new Date(l.created_at).toLocaleString()}</div><button class="ghost" style="margin-top:8px" onclick="updateLead('${l.id}','contacted')">Mark contacted</button></div>`).join("")||"<p class=muted>No leads yet.</p>"}</div></main>${bottom()}`}
async function updateLead(id,status){await api("/api/admin/leads/"+id,{method:"PATCH",headers:{...authHeaders(),"Content-Type":"application/json"},body:JSON.stringify({status})});toast("Lead updated");adminPage()}
async function bootAuth(){
  try{
    const c=await api("/api/config");
    if(c.supabase.url&&c.supabase.anonKey&&window.supabase){
      window._supabase=window.supabase.createClient(c.supabase.url,c.supabase.anonKey);
      const {data}=await window._supabase.auth.getSession();
      if(data.session){state.user={...data.session.user,access_token:data.session.access_token};await loadAccountData();}
      window._supabase.auth.onAuthStateChange(async (_event,session)=>{
        if(session){state.user={...session.user,access_token:session.access_token};await loadAccountData();}
        else state.user=null;
        render();
      });
    }
  }catch(e){console.warn(e)}
}
bootAuth();
init();
setTimeout(loadPlannerAIStatus,200);
</script>
