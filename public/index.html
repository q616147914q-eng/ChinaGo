 {cat:"life",title:"Where is the restroom?",cn:"请问卫生间在哪里？",en:"Where is the restroom?"},

function home(){return '<div class="hero"><section class="heroMain"><div><div class="eyebrow">CHINAGO · EVERYDAY CHINA COMPANION</div><h1>China, without the confusion.</h1><p>Already in China? ChinaGo helps you handle the things that happen in real life — ordering food, getting around, communicating, paying and solving everyday problems.</p></div><div><div class="heroBtns"><button class="cta" onclick="go(\'food\')">🍜 Order food</button><button class="cta dark" onclick="go(\'move\')">🚇 Get around</button><button class="cta dark" onclick="go(\'talk\')">🗣️ Say it in Chinese</button></div><div style="color:#999;font-size:11px;margin-top:16px;position:relative;z-index:2">Trip planning is still available, but it is no longer the center of ChinaGo.</div></div></section><section class="homeTools">'+TOOLS.map(t=>'<div class="toolTile" onclick="go(\''+t.id+'\')"><div><div class="ico">'+t.icon+'</div><h3>'+t.title+'</h3><p>'+t.desc+'</p></div><button class="primary">'+t.sub+' →</button></div>').join("")+'</section></div><section class="section"><div class="sectionHead"><div><h2>What do you need right now?</h2><span class="muted">Designed around situations, not destinations.</span></div></div><div class="quickGrid">'+[["🍜","I have a menu","Understand dishes & make an order card","food"],["🚕","I need a taxi","Show the driver a Chinese destination","move"],["💳","Payment failed","Troubleshoot Alipay / WeChat Pay","pay"],["🗣️","I need to say something","Show a natural Chinese phrase","talk"],["📱","Everyday problem","SIM, bikes, delivery, pharmacy…","life"],["🆘","I need help","Useful urgent phrases","help"]].map(x=>'<button class="quick" onclick="go(\''+x[3]+'\')"><b>'+x[0]+" "+x[1]+'</b><span>'+x[2]+"</span></button>").join("")+'</div></section><section class="section"><div class="notice"><b>ChinaGo principle:</b> we do not claim to have booked a taxi, hotel or ticket unless a real provider confirms it. Current prices, schedules and rules should be checked live.</div></section>'}

  const center='<section class="commandCenter"><div class="commandTop"><div><h3>What do you need right now?</h3><span>Tell ChinaGo the problem — not the destination.</span></div><button class="installBtn" onclick="installChinaGo()">Install</button></div><div class="commandInput"><input id="commandInput" placeholder="e.g. My driver cannot find my hotel"><button class="primary" onclick="solveCommand()">Solve</button></div><div class="intentGrid"><button class="intent" onclick="commandIntent(\'food\')"><b>🍜 Food problem</b><span>Menu, spice, ingredients</span></button><button class="intent" onclick="commandIntent(\'move\')"><b>🚕 Transport problem</b><span>Taxi, route, destination</span></button><button class="intent" onclick="commandIntent(\'talk\')"><b>🗣️ Language problem</b><span>What should I say?</span></button><button class="intent" onclick="commandIntent(\'pay\')"><b>💳 Payment problem</b><span>Paying or payment failed</span></button></div><div class="setupStrip"><span class="tag">MY CITY</span><select onchange="saveCity(this.value)"><option>Beijing</option><option>Shanghai</option><option>Guangzhou</option><option>Shenzhen</option><option>Xi-an</option><option>Chengdu</option><option>Luoyang</option><option>Zhengzhou</option><option>Dengfeng</option></select><span class="mini">ChinaGo remembers this only on this device.</span></div><div id="commandAnswer"></div></section><section class="chinaCard" id="chinaCard"><h3>🪪 My China Card</h3><div class="muted">Keep the few details you may need to show quickly. Stored only on this device.</div><div class="chinaCardGrid" id="chinaCardView"></div><div class="chinaCardActions"><button onclick="toggleChinaCardForm()">Edit card</button><button onclick="shareChinaCard()">Share / Copy</button></div><div class="profileForm" id="chinaCardForm"><div class="profileGrid"><input id="ccHotel" placeholder="Hotel name / Chinese name"><input id="ccAddress" placeholder="Hotel Chinese address"><input id="ccDiet" placeholder="Food restrictions (e.g. no pork)"><select id="ccLanguage"><option value="English">English</option><option value="French">French</option><option value="German">German</option><option value="Spanish">Spanish</option><option value="Japanese">Japanese</option><option value="Korean">Korean</option></select><input id="ccEmergency" placeholder="Emergency contact"></div><div class="chinaCardActions"><button onclick="saveChinaCard()">Save</button><button onclick="clearChinaCard()">Clear</button></div><div class="profileHint">Do not store passport numbers, card details or other sensitive information here.</div></div></section>';
  return base+center+serviceTeaser();
}

function serviceTeaser(){return '<section class="serviceStrip"><div class="serviceStripTop"><div><h3>Need a human hand?</h3><span>ChinaGo can turn a China problem into a service request.</span></div><button class="installBtn" onclick="go(\'services\')">View services →</button></div><div class="serviceMiniGrid">'+[["🚐","Airport transfer","Pickup help with your flight"],["🏨","Hotel help","Find or request accommodation help"],["🗣️","Local assistance","Translation, errands and on-the-ground help"]].map(x=>'<div class="serviceMini"><div class="ico">'+x[0]+'</div><b>'+x[1]+'</b><small>'+x[2]+'</small></div>').join("")+'</div></section>'}
function saveCity(city){localStorage.setItem("cg_city",city);toast("City saved: "+city)}
function chinaCardData(){try{return JSON.parse(localStorage.getItem("cg_card")||"{}")}catch{return {}}}
function renderChinaCard(){
  const d=chinaCardData(),v=$("#chinaCardView"); if(!v)return;
  const rows=[["Hotel",d.hotel||"Not set"],["Address",d.address||"Not set"],["Food",d.diet||"Not set"],["Language",d.language||"English"],["Emergency",d.emergency||"Not set"]];
  v.innerHTML=rows.map(x=>'<div class="chinaCardItem"><b>'+esc(x[0])+'</b>'+esc(x[1])+'</div>').join("");
  const map={ccHotel:"hotel",ccAddress:"address",ccDiet:"diet",ccLanguage:"language",ccEmergency:"emergency"};
  Object.keys(map).forEach(id=>{const e=$("#"+id);if(e)e.value=d[map[id]]||""});
}
function toggleChinaCardForm(){const f=$("#chinaCardForm");if(f)f.classList.toggle("open")}
function saveChinaCard(){
  const d={hotel:$("#ccHotel")?.value.trim(),address:$("#ccAddress")?.value.trim(),diet:$("#ccDiet")?.value.trim(),language:$("#ccLanguage")?.value||"English",emergency:$("#ccEmergency")?.value.trim()};
  localStorage.setItem("cg_card",JSON.stringify(d));renderChinaCard();$("#chinaCardForm")?.classList.remove("open");toast("China Card saved on this device");
}
function clearChinaCard(){localStorage.removeItem("cg_card");renderChinaCard();toast("China Card cleared")}
async function shareChinaCard(){
  const d=chinaCardData(),city=localStorage.getItem("cg_city")||"";
  const text=["MY CHINA CARD",city&&("City: "+city),d.hotel&&("Hotel: "+d.hotel),d.address&&("Address: "+d.address),d.diet&&("Food: "+d.diet),d.language&&("Language: "+d.language),d.emergency&&("Emergency contact: "+d.emergency)].filter(Boolean).join("\n");
  try{if(navigator.share){await navigator.share({title:"My China Card",text});toast("Shared")}else{await copyText(text)}}catch{}
}
function commandIntent(tab){go(tab)}
function localQuickSolve(q){
  const ql=q.toLowerCase();
  if(/allerg|peanut|nut|pork|beef|vegetarian|vegan|spicy|chili|menu|eat|food/.test(ql)) return ["🍜 Food problem","Open Food → filter ingredients/spice → analyze the menu or show the order card."];
  if(/taxi|driver|car|ride|route|metro|subway|station|airport transfer/.test(ql)) return ["🚕 Transport problem","Open Move → enter the destination → use Driver card. For exact live routes or departures, verify in the city/operator app."];
  if(/hotel|check.?in|room|accommodation/.test(ql)) return ["🏨 Hotel problem","Open Talk for a check-in phrase, and use My China Card above to keep your hotel name and Chinese address ready to show."];
  if(/pay|alipay|wechat|payment|qr|card|cash/.test(ql)) return ["💳 Payment problem","Open Pay → follow the setup checklist → keep a physical card or cash backup if a mobile payment fails."];
  if(/chinese|say|phrase|language|speak|translate/.test(ql)) return ["🗣️ Language problem","Open Talk → describe what you need → create a phrase you can show to a local."];
  if(/train|railway|ticket|station/.test(ql)) return ["🚆 Train problem","Keep your passport and train number ready. Open Talk for a phrase such as “请问在哪里检票？” and confirm station details on the operator app."];
  if(/toilet|restroom|bathroom|washroom/.test(ql)) return ["🚻 Restroom problem","Open Talk and use “请问卫生间在哪里？” — Where is the restroom?"];
  if(/pharmacy|medicine|drug|chemist/.test(ql)) return ["💊 Pharmacy problem","Open Life for the pharmacy guide. Show the exact medicine name to a pharmacist; for urgent medical needs use Help."];
  if(/sim|esim|phone|mobile data|roaming/.test(ql)) return ["📶 SIM / eSIM problem","Open Life for the connectivity checklist and keep the phone number that can receive verification messages."];
  if(/delivery|meituan|package|courier/.test(ql)) return ["📦 Delivery problem","Open Life for delivery/courier guidance. Keep your hotel Chinese address ready in My China Card."];
  if(/help|police|doctor|hospital|emergency|lost passport/.test(ql)) return ["🆘 Need help","Open Help for emergency numbers and ready-to-show Chinese phrases."];
  return ["ChinaGo quick solve","Start with Food, Move, Talk, Pay or Life. If you describe the exact problem, ChinaGo can route it to the most relevant tool."];
}
function solveCommand(){
  const q=($("#commandInput")||{}).value?.trim();
  if(!q)return toast("Describe the problem first");
  const box=$("#commandAnswer");box.innerHTML='<div class="answerCard"><b>ChinaGo is working on it…</b>Finding the most practical next step.</div>';
  api("/api/chat",{method:"POST",body:JSON.stringify({message:q,context:{product:"ChinaGo Everyday China Companion",city:localStorage.getItem("cg_city")||"Beijing"}})})
  .then(d=>{box.innerHTML='<div class="answerCard"><b>Next steps</b>'+esc(d.answer||"Use one of the tools below.")+'</div>'})
  .catch(()=>{const [title,local]=localQuickSolve(q);box.innerHTML='<div class="answerCard"><b>'+title+'</b>'+esc(local)+'</div>'});
}
function installChinaGo(){
  if(window.__chinagoInstall){window.__chinagoInstall.prompt();window.__chinagoInstall=null}
  else toast("On mobile: browser menu → Add to Home Screen");
}

function toolHero(title,sub){return '<section class="toolHero"><div class="eyebrow">CHINAGO TOOL</div><h1>'+title+'</h1><p>'+sub+"</p></section>"}
function food(){const f=state.food;let dishes=DISHES.slice();if(f.spice!=="any")dishes=dishes.filter(d=>d.spice<=Number(f.spice));if(f.avoid.trim())dishes=dishes.filter(d=>!d.contains.toLowerCase().includes(f.avoid.trim().toLowerCase()));return toolHero("🍜 Order Food","Understand a Chinese menu, filter by what you eat, then show a simple order card to the restaurant.")+'<section class="panel"><div class="formGrid"><div class="field"><label>What do you avoid? (e.g. pork, peanuts, beef)</label><input value="'+esc(f.avoid)+'" oninput="state.food.avoid=this.value"/></div><div class="field"><label>Maximum spice</label><select onchange="state.food.spice=this.value;render()"><option value="any" '+(f.spice==="any"?"selected":"")+'>Any</option><option value="0" '+(f.spice==="0"?"selected":"")+'>No spice</option><option value="1" '+(f.spice==="1"?"selected":"")+'>Mild</option><option value="2" '+(f.spice==="2"?"selected":"")+'>Medium</option><option value="3" '+(f.spice==="3"?"selected":"")+'>Hot</option><option value="4" '+(f.spice==="4"?"selected":"")+'>Very hot</option></select></div></div><div class="field" style="margin-top:12px"><label>Menu text (optional) — paste dish names here</label><textarea placeholder="宫保鸡丁\n麻婆豆腐\n清炒时蔬" oninput="state.food.text=this.value">'+esc(f.text)+'</textarea></div><div class="row" style="margin-top:10px"><button class="primary" onclick="analyzeFood()">Analyze menu</button><button class="primary ghost" onclick="showOrderCard()">Show my order card</button></div><div id="foodResult"></div></section><section class="section"><div class="sectionHead"><h2>Starter menu</h2><span class="muted">'+dishes.length+' options</span></div><div class="dishGrid">'+dishes.map(d=>'<div class="dish"><b>'+d.en+'</b><span style="font-weight:750">'+d.cn+'</span><small>'+d.taste+' · Spice '+("🌶️".repeat(d.spice)||"none")+'</small><small>'+d.good+'</small><small class="'+(f.avoid&&d.contains.toLowerCase().includes(f.avoid.toLowerCase())?"danger":"")+'">Contains: '+d.contains+"</small></div>").join("")+"</div></section>"}
function analyzeFood(){const text=state.food.text.trim();const lines=text?text.split(/\n|,/).map(x=>x.trim()).filter(Boolean):[];let found=lines.length?lines.map(line=>DISHES.find(d=>d.cn===line||d.en.toLowerCase()===line.toLowerCase())||{cn:line,en:"Unknown dish",taste:"Ask the restaurant",spice:0,contains:"unknown",good:"ChinaGo does not have enough information about this dish."}):DISHES.filter(d=>state.food.spice==="any"||d.spice<=Number(state.food.spice)).filter(d=>!state.food.avoid||!d.contains.toLowerCase().includes(state.food.avoid.toLowerCase())).slice(0,4);$("#foodResult").innerHTML='<div class="resultBox"><h3>What to order</h3><div class="dishGrid">'+found.map(d=>'<div class="dish"><b>'+esc(d.en)+" · "+esc(d.cn)+'</b><small>'+esc(d.taste)+' · Spice '+("🌶️".repeat(d.spice)||"none")+'</small><small>Contains: '+esc(d.contains)+"</small></div>").join("")+"</div></div>"}
function showOrderCard(){const items=DISHES.filter(d=>state.food.spice==="any"||d.spice<=Number(state.food.spice)).filter(d=>!state.food.avoid||!d.contains.toLowerCase().includes(state.food.avoid.toLowerCase())).slice(0,3);$("#foodResult").innerHTML='<div class="resultBox"><h3>Show this to the restaurant</h3><p>请给我以下菜品，谢谢：</p>'+items.map(d=>'<div class="phrase"><button class="copy" onclick="copyText(\''+d.cn+'\')">Copy</button><div class="cn">'+d.cn+'</div><div class="en">'+d.en+"</div></div>").join("")+'<div class="phrase"><div class="cn">不要太辣，谢谢。</div><div class="en">Please don\'t make it too spicy.</div></div></div>'}
function move(){const m=state.move;return toolHero("🚇 Get Around","Build a practical route prompt, prepare Chinese station names, or show a taxi driver exactly where you want to go.")+'<section class="panel"><div class="formGrid"><div class="field"><label>City</label><select onchange="state.move.city=this.value;render()">'+["Beijing","Shanghai","Guangzhou","Shenzhen","Xi'an","Chengdu","Luoyang","Zhengzhou"].map(c=>'<option '+(m.city===c?"selected":"")+'>'+c+"</option>").join("")+'</select></div><div class="field"><label>Mode</label><select onchange="state.move.mode=this.value;render()"><option value="metro" '+(m.mode==="metro"?"selected":"")+'>Metro / public transport</option><option value="taxi" '+(m.mode==="taxi"?"selected":"")+'>Taxi / ride-hailing</option><option value="walk" '+(m.mode==="walk"?"selected":"")+'>Walking</option></select></div><div class="field"><label>From</label><input placeholder="e.g. Beijing South Railway Station" value="'+esc(m.from)+'" oninput="state.move.from=this.value"/></div><div class="field"><label>To</label><input placeholder="e.g. Forbidden City" value="'+esc(m.to)+'" oninput="state.move.to=this.value"/></div></div><div class="row" style="margin-top:12px"><button class="primary" onclick="buildRoute()">Build route helper</button><button class="primary ghost" onclick="taxiCard()">Driver card</button></div><div id="moveResult"></div></section><section class="section"><div class="notice"><b>Important:</b> ChinaGo does not pretend this is a live transit feed. For exact departures, service changes and current fares, verify in the city/operator app or map.</div></section>'}
function buildRoute(){const m=state.move;if(!m.from||!m.to){toast("Enter both From and To");return}const mode=m.mode==="metro"?"Metro / public transport":m.mode==="taxi"?"Taxi / ride-hailing":"Walking";$("#moveResult").innerHTML=`<div class="resultBox"><h3>${esc(mode)} · ${esc(m.city)}</h3><div class="transportSteps"><div class="step"><div class="num">1</div><div><b>Start</b><span>${esc(m.from)}</span></div></div><div class="step"><div class="num">2</div><div><b>Tell a local</b><span>我想去“${esc(m.to)}”，请问怎么走？</span></div></div><div class="step"><div class="num">3</div><div><b>Destination</b><span>${esc(m.to)}</span></div></div></div><div class="row" style="margin-top:12px"><button class="primary" onclick="copyText(this.dataset.text)" data-text="${esc("我想去 "+m.to+"，请问怎么走？")}">Copy Chinese</button><a class="primary" style="text-decoration:none" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(m.to+" "+m.city)}">Open map search</a></div></div>`}
function taxiCard(){const m=state.move;if(!m.to){toast("Enter a destination");return}$("#moveResult").innerHTML='<div class="resultBox"><h3>📱 Show this to the driver</h3><div class="phrase"><button class="copy" onclick="copyText(\''+m.to+'\')">Copy</button><div class="cn">'+esc(m.to)+'</div><div class="en">Destination</div></div><div class="phrase"><div class="cn">请送我到这里，谢谢。</div><div class="en">Please take me here, thank you.</div></div><div class="phrase"><div class="cn">到了以后请提醒我。</div><div class="en">Please let me know when we arrive.</div></div></div>'}
function talk(){const p=PHRASES.filter(x=>x.cat===state.talkCat);return toolHero("🗣️ Say it in Chinese","Type what you need to say, or choose a ready-made situation. ChinaGo turns common travel needs into a phrase you can show.")+`<section class="panel"><div class="chips">${["taxi","food","transport","hotel","life","help"].map(c=>`<button class="chip ${state.talkCat===c?"on":""}" onclick="state.talkCat=&quot;${c}&quot;;render()">${c}</button>`).join("")}</div><div class="field" style="margin-top:13px"><label>What do you want to say?</label><textarea id="talkInput" placeholder="e.g. I do not eat pork and I want this dish without chili.">${esc(state.talkText)}</textarea></div><div class="row" style="margin-top:9px"><button class="primary" onclick="makePhrase()">Create phrase</button></div><div id="talkResult"></div></section><section class="section"><div class="sectionHead"><h2>Ready phrases</h2></div>${p.map(x=>`<div class="phrase"><button class="copy" onclick="copyText(this.dataset.text)" data-text="${esc(x.cn)}">Copy</button><b>${esc(x.title)}</b><div class="cn">${esc(x.cn)}</div><div class="en">${esc(x.en)}</div></div>`).join("")}</section>`}
function makePhrase(){const t=$("#talkInput").value.trim();state.talkText=t;if(!t){toast("Type what you want to say");return}let cn="请问，可以帮我一下吗？";if(/pork/i.test(t))cn="我不吃猪肉，请不要放猪肉。";else if(/spicy|chili|辣/i.test(t))cn="请不要放辣椒，不要辣。";else if(/allerg/i.test(t)&&/peanut/i.test(t))cn="我对花生过敏，这道菜里有花生吗？";else if(/restroom|toilet|bathroom/i.test(t))cn="请问卫生间在哪里？";else if(/taxi|driver/i.test(t))cn="请送我到这个地方，谢谢。";else if(/how much|price|cost/i.test(t))cn="这个多少钱？";else if(/help/i.test(t))cn="你好，我需要帮助。";else cn="你好，可以帮我一下吗？"+t;$("#talkResult").innerHTML='<div class="resultBox"><h3>Show this</h3><div class="phrase"><button class="copy" onclick="copyText(\''+cn+'\')">Copy</button><div class="cn">'+cn+'</div><div class="en">Best-effort travel phrase. For legal, medical or safety-critical meaning, confirm with a qualified person.</div></div></div>'}
function pay(){return toolHero("💳 Pay in China","A practical checklist for foreigners using mobile payments. ChinaGo explains the flow; it does not handle your card or payment credentials.")+'<section class="grid"><div class="card"><span class="tag">PRIMARY</span><h3>Alipay</h3><p>Install and register before you need to pay. Check whether your international card is supported and complete any verification the app requests.</p><button class="primary" onclick="showPay(\'alipay\')">Setup checklist</button></div><div class="card"><span class="tag">BACKUP</span><h3>WeChat Pay</h3><p>Keep a second payment route available. International-card features and limits can change, so verify the current rules inside the app.</p><button class="primary" onclick="showPay(\'wechat\')">Setup checklist</button></div><div class="card"><span class="tag">FALLBACK</span><h3>Card / Cash</h3><p>Keep a physical card and a small cash backup. Some merchants may support only particular payment methods.</p><button class="primary" onclick="showPay(\'backup\')">What to do</button></div></section><div id="payResult" class="section"></div><section class="section"><div class="notice">Never send ChinaGo your full card number, CVV, password or one-time verification code.</div></section>'}
function showPay(type){const data={alipay:["1. Install Alipay and register with your own phone number.","2. Add a supported international card in the payment/wallet area.","3. Complete identity verification if requested.","4. Test a small merchant payment before relying on it.","5. Keep WeChat Pay or another backup."],wechat:["1. Install WeChat and register.","2. Open the payment/wallet section.","3. Follow the current international-card verification flow.","4. Test a merchant payment.","5. Keep Alipay as a backup."],backup:["1. Keep one physical international card with you.","2. Carry a small amount of RMB cash for situations where digital payment is unavailable.","3. If a QR payment fails, ask: 可以刷卡吗？ (Can I pay by card?)","4. If needed, show: 可以用现金吗？ (Can I pay cash?)"]}[type];$("#payResult").innerHTML=`<div class="panel"><h3>${{alipay:"Alipay",wechat:"WeChat Pay",backup:"Backup payment"}[type]} checklist</h3><div class="transportSteps">${data.map((x,i)=>`<div class="step"><div class="num">${i+1}</div><div><span>${esc(x)}</span></div></div>`).join("")}</div></div>`}
function life(){return toolHero("📱 China Life","Practical mini-guides for the everyday problems that do not fit inside a travel itinerary.")+'<div class="lifeGrid">'+LIFE.map(x=>'<article class="lifeCard"><div class="big">'+x.icon+'</div><h3>'+x.title+'</h3><p>'+x.text+"</p></article>").join("")+'</div><section class="section"><div class="panel"><div class="sectionHead"><div><h2>Ask a current question</h2><span class="muted">Server mode can use the AI/live-search layer when configured.</span></div></div><div class="search"><input id="liveInput" placeholder="e.g. Can foreigners use this metro today?"/><button class="primary" onclick="liveSearch()">Search</button></div><div id="liveResult" class="liveResult"></div></div></section>'}
async function liveSearch(){const q=$("#liveInput").value.trim();if(!q)return toast("Enter a question");$("#liveResult").textContent="Checking…";try{const d=await api("/api/live-search",{method:"POST",body:JSON.stringify({query:q,location:"China"})});$("#liveResult").textContent=d.answer||"No answer";}catch(e){$("#liveResult").textContent=e.message}}

 '<section class="section"><div class="serviceGrid">'+SERVICE_CATALOG.map(s=>'<article class="serviceCard"><div class="svcIcon">'+s.icon+'</div><h3>'+s.title+'</h3><p>'+s.desc+'</p><div class="serviceStatus'+serviceStatusClass(s.id)+'">'+serviceStatusText(s.id)+'</div><div class="svcActions"><button class="primary" onclick="selectService(\''+s.id+'\')">Request help</button><button class="primary ghost" onclick="checkService(\''+s.id+'\')">Check provider</button></div></article>').join("")+'</div></section>'+
 '<section class="section panel serviceForm"><h3>Request: '+active.icon+' '+active.title+'</h3><div class="hint">Tell us only what is needed to handle the request. Do not enter passport numbers, card numbers, passwords or other sensitive credentials.</div><div class="formGrid" style="margin-top:12px"><div class="field"><label>City</label><input value="'+esc(serviceState.city)+'" oninput="serviceState.city=this.value"/></div><div class="field"><label>Date (optional)</label><input type="date" value="'+esc(serviceState.date)+'" onchange="serviceState.date=this.value"/></div><div class="field"><label>People</label><input type="number" min="1" max="20" value="'+esc(serviceState.pax)+'" oninput="serviceState.pax=this.value"/></div><div class="field"><label>Email / contact (optional)</label><input id="serviceContact" placeholder="How should we contact you?"/></div></div><div class="field" style="margin-top:12px"><label>What do you need?</label><textarea id="serviceDetails" placeholder="Example: Landing at PEK at 18:30, 2 people, hotel near Sanlitun. Need an English-speaking driver.">'+esc(serviceState.details)+'</textarea></div><div class="row" style="margin-top:10px"><button class="primary" onclick="submitServiceRequest()">Send request</button><button class="primary ghost" onclick="checkService(\''+active.id+'\')">Check connected provider</button></div><div id="serviceResults"></div></section>'+
 '<section class="section"><div class="notice"><b>How this works:</b> request → ChinaGo checks the available provider path → you receive a confirmation or follow-up. If no live provider is connected, the request is still captured as a lead in demo/request mode.</div></section>';
}
function selectService(id){serviceState.id=id;serviceState.results=null;render();window.scrollTo({top:0,behavior:"smooth"})}
async function loadServiceStatus(){try{serviceState.status=await api("/api/services")}catch{serviceState.status=null}}
async function checkService(id){
 serviceState.id=id;
 const payload={city:serviceState.city,date:serviceState.date,party_size:Number(serviceState.pax)||1};
 const box=$("#serviceResults");if(box)box.innerHTML='<div class="serviceResult">Checking connected provider…</div>';
 try{const d=await api("/api/service-search",{method:"POST",body:JSON.stringify({serviceId:id,payload})});serviceState.results=d;if(box)renderServiceResults()}
 catch(e){if(box)box.innerHTML='<div class="serviceResult"><b>Provider check unavailable</b>'+esc(e.message)+'</div>'}
}
function renderServiceResults(){
 const box=$("#serviceResults");if(!box)return;
 const d=serviceState.results||{};
 if(!d.configured){box.innerHTML='<div class="serviceResult"><b>Request-based service</b>'+esc(d.message||"No live supplier is connected yet. You can still send a request to ChinaGo.")+'</div>';return}
 const items=Array.isArray(d.items)?d.items:[];
 if(!items.length){box.innerHTML='<div class="serviceResult"><b>Provider connected</b>No matching live items were returned. Send a request and ChinaGo can follow up.</div>';return}
 box.innerHTML=items.slice(0,6).map((x,i)=>'<div class="serviceResult"><b>'+esc(x.title||x.name||x.hotel_name||("Option "+(i+1)))+'</b>'+esc(x.description||x.summary||x.price_text||"Provider result returned; confirm final price and terms before purchase.")+'</div>').join("");
}
async function submitServiceRequest(){
 const details=$("#serviceDetails")?.value.trim()||"";
 const contact=$("#serviceContact")?.value.trim()||"";
 if(!details){toast("Describe what you need first");return}
 serviceState.details=details;
 const svc=SERVICE_CATALOG.find(x=>x.id===serviceState.id)||SERVICE_CATALOG[0];
 try{
  const d=await api("/api/booking-leads",{method:"POST",body:JSON.stringify({category:svc.kind,offer_id:serviceState.id,customer_email:contact,travel_date:serviceState.date||null,party_size:Number(serviceState.pax)||1,request_json:{service_id:serviceState.id,service_title:svc.title,city:serviceState.city,details}})});
  const box=$("#serviceResults");
  if(box)box.innerHTML='<div class="serviceSuccess"><b>Request received.</b> '+esc(d.lead_id?"Reference: "+d.lead_id:"ChinaGo request saved.")+'<br>We will only treat it as booked after a real provider confirms it.</div>';
  toast("Request sent");
 }catch(e){toast("Could not send request: "+e.message)}
}

function more(){return toolHero("＋ More","Travel planning and booking remain available, but they are supporting features rather than the center of ChinaGo.")+'<div class="moreList"><div class="moreItem"><div><h3>🧳 ChinaGo Services</h3><p>Airport transfer, driver, hotel help, translation and local assistance.</p></div><button class="primary" onclick="go(\'services\')">Open</button></div><div class="moreItem"><div><h3>✦ Trip Planner</h3><p>Build a multi-day China itinerary when you actually need one.</p></div><button class="primary" onclick="goPlan()">Open</button></div><div class="moreItem"><div><h3>🏨 Hotels</h3><p>Live hotel search is available when the Booking.com provider is connected.</p></div><button class="primary" onclick="hotelHelp()">Open</button></div><div class="moreItem"><div><h3>◌ AI Assistant</h3><p>Ask ChinaGo a practical China question.</p></div><button class="primary" onclick="goChat()">Open</button></div></div>'}
function goPlan(){toast("Trip Planner is retained as a secondary module. The new core tools are Food, Move, Talk, Pay and Life.")}
function hotelHelp(){toast("Hotel search requires a connected provider. Use the hotel/booking flow when credentials are configured.")}
function goChat(){const box='<section class="panel chat"><div class="messages" id="messages">'+state.chat.map(m=>'<div class="bubble '+m.role+'">'+esc(m.text)+'</div>').join("")+'</div><div class="chatBar"><input id="chatInput" placeholder="Ask about China…"/><button class="primary" onclick="sendChat()">Send</button></div></section>';app.innerHTML=nav()+'<main class="shell">'+toolHero("◌ ChinaGo Assistant","Practical China help. Current facts should be verified live.")+box+"</main>"+bottom();setTimeout(()=>$("#chatInput")?.focus(),50)}
async function sendChat(){const input=$("#chatInput");const q=input?.value.trim();if(!q||state.chatLoading)return;state.chat.push({role:"user",text:q});state.chatLoading=true;goChat();try{const d=await api("/api/chat",{method:"POST",body:JSON.stringify({message:q,context:{product:"ChinaGo Survival OS"}})});state.chat.push({role:"ai",text:d.answer||"I couldn't answer that."})}catch(e){state.chat.push({role:"ai",text:"I couldn't reach the assistant. Try one of the practical tools instead."})}state.chatLoading=false;goChat()}
async function api(path,opt={}){if(STATIC_MODE){if(path==="/api/chat")return {answer:"Offline ChinaGo mode: use the Food, Move, Talk, Pay and Life tools without a server. Current information needs server mode.",mode:"static"};if(path==="/api/live-search")return {answer:"Live search needs ChinaGo server mode.",mode:"static"};return {ok:true}}const r=await fetch(path,{headers:{"Content-Type":"application/json",...(opt.headers||{})},...opt});let d;try{d=await r.json()}catch{throw new Error("Server returned "+r.status)}if(!r.ok)throw new Error(d.error||"Request failed");return d}

if("serviceWorker" in navigator && location.protocol!=="file:"){window.addEventListener("load",()=>navigator.serviceWorker.register("/sw.js").catch(()=>{}));}
window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();window.__chinagoInstall=e;});

function init(){render();renderChinaCard()}
init();
</script>
