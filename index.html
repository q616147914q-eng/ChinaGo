/* CHINAGO PREMIUM UI V2 */
:root{
  --ink:#171714;--muted:#73736c;--paper:#f4f2ed;--card:#fbfaf7;
  --line:#dedbd3;--accent:#8e241c;--soft:#ebe8e0;--green:#315c49;
}
body{background:var(--paper);color:var(--ink);letter-spacing:-.01em}
.top{height:72px;background:rgba(244,242,237,.92);border-bottom:1px solid rgba(23,23,20,.09);box-shadow:none}
.shell{width:min(1180px,100% - 40px)}
.brand{font-size:24px;letter-spacing:-.075em}
.brand span{color:var(--accent)}
.nav{gap:2px}
.nav button,.topAction{padding:8px 11px;border-radius:7px;color:#77756e;font-size:12px}
.nav button.active{background:var(--ink);color:#fff}
.topAction{border-color:var(--line);background:transparent;color:var(--ink)}
main{padding:34px 0 100px}
.hero{grid-template-columns:minmax(0,1.35fr) minmax(300px,.65fr);gap:18px}
.heroMain{border-radius:4px;padding:42px;min-height:500px;background:#171714}
.heroMain:after{width:520px;height:520px;right:-230px;top:-230px;background:radial-gradient(circle,rgba(142,36,28,.72) 0,transparent 67%);opacity:1}
.eyebrow{font-size:10px;letter-spacing:.2em;color:#aaa69c}
.hero h1{font-size:clamp(48px,7.3vw,86px);line-height:.86;letter-spacing:-.085em;max-width:760px}
.hero p{font-size:16px;line-height:1.65;color:#bdbab2;max-width:540px}
.heroBtns{gap:7px}
.cta{border-radius:3px;padding:13px 18px;font-size:13px}
.cta.dark{background:transparent;border:1px solid #494842}
.homeTools{grid-template-columns:1fr 1fr;gap:10px}
.toolTile{border-radius:4px;border:1px solid var(--line);padding:20px;min-height:240px;background:var(--card)}
.toolTile .ico{font-size:24px;filter:grayscale(1)}
.toolTile h3{font-size:18px;font-weight:750}
.toolTile p{font-size:12px;color:#77756e;line-height:1.6}
.section{margin-top:42px}
.sectionHead{margin-bottom:16px}
.sectionHead h2{font-size:25px;font-weight:760}
.card,.panel{border-radius:4px;border:1px solid var(--line);background:var(--card);box-shadow:none}
.card{padding:20px}
.card h3{font-size:18px}
.card p{font-size:13px;line-height:1.65}
.toolHero{border-radius:4px;padding:27px 28px;background:#171714}
.toolHero h1{font-size:34px}
.toolHero p{font-size:13px;color:#aaa79e}
.primary{border-radius:3px;padding:11px 15px;font-size:12px;letter-spacing:.01em}
.ghost{background:transparent!important}
.tag{border-radius:3px;padding:5px 8px;background:#e8e5dd;color:#66635c}
.chip{border-radius:3px;background:transparent;border-color:#d8d5cc;padding:8px 11px;font-size:12px}
.chip.on{background:var(--ink);border-color:var(--ink)}
.resultBox{border-radius:4px;background:#ece9e1;padding:18px}
.dishGrid{gap:8px}
.dish{border-radius:3px;border:1px solid #e2dfd7;background:#fbfaf7}
.field input,.field select,.field textarea{border-radius:3px;border-color:#d7d4cb;background:#fbfaf7}
.field input:focus,.field select:focus,.field textarea:focus{border-color:#8e8a80;box-shadow:0 0 0 2px rgba(23,23,20,.05)}
.bottomNav{background:rgba(244,242,237,.96)!important;border-top:1px solid rgba(23,23,20,.1)!important;box-shadow:none!important}
.bottomNav button{font-size:10px}
a{color:inherit}
button{transition:background .18s ease,color .18s ease,border-color .18s ease,transform .18s ease}
button:hover{transform:translateY(-1px)}
.primary:hover,.cta:hover{background:#292925}
@media(max-width:800px){
  .shell{width:min(100% - 24px,1180px)}
  .top{height:62px}
  .nav{display:none}
  .topAction{font-size:11px;padding:7px 9px}
  main{padding-top:20px}
  .hero{grid-template-columns:1fr}
  .heroMain{min-height:470px;padding:28px 24px}
  .hero h1{font-size:clamp(46px,15vw,70px)}
  .homeTools{grid-template-columns:1fr 1fr}
  .toolTile{min-height:205px;padding:16px}
  .grid{grid-template-columns:1fr}
  .formGrid{grid-template-columns:1fr}
}
@media(max-width:480px){
  .homeTools{gap:8px}
  .toolTile{min-height:185px}
  .toolTile h3{font-size:16px}
  .toolTile p{font-size:11px}
  .heroMain{min-height:430px}
}

body{background:#f7fbff!important;color:var(--ref-ink)!important;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif!important}
body:after{display:none!important}
.refTop{position:relative!important;top:auto!important;height:76px!important;background:rgba(255,255,255,.76)!important;border:0!important;box-shadow:none!important;backdrop-filter:blur(18px)!important}
.refNav{height:76px;max-width:1600px;width:calc(100% - 112px);margin:auto;display:grid;grid-template-columns:1fr auto 1fr;align-items:center}
.refBrand{border:0;background:transparent;display:flex;align-items:center;gap:9px;color:#0a1420;padding:0;font-size:27px;font-weight:900;letter-spacing:-.06em}
.refBrand>strong>span{color:#ef3c39}
.mountLogo{width:45px;height:30px;position:relative;display:inline-block;overflow:hidden}
.mountLogo i{position:absolute;display:block;bottom:1px;width:0;height:0;border-left:14px solid transparent;border-right:14px solid transparent;border-bottom:21px solid #1686ef}
.mountLogo i:nth-child(1){left:0;border-left-width:14px;border-right-width:14px;border-bottom-width:19px;filter:brightness(1.05)}
.mountLogo i:nth-child(2){left:10px;border-left-width:15px;border-right-width:15px;border-bottom-width:25px;color:#45b4ff;border-bottom-color:#45b4ff}
.mountLogo i:nth-child(3){left:24px;border-left-width:12px;border-right-width:12px;border-bottom-width:17px;border-bottom-color:#4f79ff}
.refNavLinks{display:flex;align-items:center;gap:9px}
.refNavLinks button,.refNavRight button{border:0;background:transparent;color:#18304a;font-size:13px;font-weight:600;padding:9px 16px;border-radius:999px}
.refNavLinks button.active{background:#071621;color:#fff;box-shadow:0 8px 18px rgba(7,22,33,.13)}
.refNavRight{justify-self:end;display:flex;align-items:center;gap:2px}
.refNavRight>button:not(.signIn){font-size:21px;padding:8px 6px;font-weight:500}
.refNavRight .lang{font-size:13px;padding-left:2px;padding-right:10px}
.refNavRight .signIn{background:#071621;color:#fff;padding:11px 19px;margin-left:7px;box-shadow:0 8px 18px rgba(7,22,33,.13)}
main.shell{width:100%!important;max-width:none!important;padding:0!important}
.refPage{background:linear-gradient(180deg,#fff 0,#f7fbff 100%);min-height:calc(100vh - 76px);padding-bottom:80px}

.refHeroGlow{position:absolute;inset:0;background:radial-gradient(ellipse at 80% 45%,rgba(255,203,158,.12),transparent 28%),linear-gradient(180deg,rgba(255,255,255,.18),transparent 45%);pointer-events:none}
.refHeroContent{position:absolute;left:max(calc((100vw - 1555px)/2),6.2vw);top:50px;z-index:2}
.refEyebrow{display:flex;align-items:center;gap:10px;font:600 10px/1 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.27em;color:#6b8098}
.refEyebrow span{width:25px;height:4px;border-radius:4px;background:#299af3;display:inline-block}
.refEyebrow b{font-weight:500;color:#a5b4c4}
.refHero h1{margin:18px 0 13px;font-size:clamp(66px,6.4vw,99px);line-height:.88;letter-spacing:-.08em;font-weight:850;color:#07182a}
.refHero h1 em{font-style:normal;background:linear-gradient(90deg,#2699ef 0%,#286fe5 58%,#7160e8 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.refHeroContent p{margin:0;color:#526b88;font-size:17px;line-height:1.52;font-weight:450}
.refHeroBtns{display:flex;gap:14px;margin-top:19px}
.refBtn{height:46px;border-radius:24px;padding:0 22px;border:1px solid #dce7f1;background:rgba(255,255,255,.75);color:#17324d;font-size:13px;font-weight:750;box-shadow:0 8px 20px rgba(45,95,135,.06)}
.refBtn.dark,.generateBtn{background:#071621;color:#fff;border-color:#071621;box-shadow:0 10px 24px rgba(7,22,33,.16)}
.refBtn strong,.generateBtn strong{font-size:16px;margin-left:8px}
.refExplore{position:absolute;right:7.3%;top:235px;color:#fff;font:italic 29px/1.05 "Segoe Print","Bradley Hand",cursive;transform:rotate(-7deg);text-align:center;text-shadow:0 2px 15px rgba(13,62,103,.3);z-index:2}
.refExplore i{display:block;width:118px;height:16px;border-bottom:2px solid #fff;border-radius:50%;transform:rotate(-4deg);margin:1px auto 0}
.journeyBox{position:absolute;z-index:5;left:max(calc((100vw - 1555px)/2),6.2vw);right:max(calc((100vw - 1555px)/2),6.2vw);bottom:-82px;background:rgba(255,255,255,.91);border:1px solid rgba(214,228,240,.9);border-radius:16px;padding:14px 18px 18px;box-shadow:0 18px 40px rgba(55,100,137,.13);backdrop-filter:blur(16px)}
.journeyTitle{font-size:13px;font-weight:800;color:#182f47;margin-bottom:10px;display:flex;align-items:center;gap:7px}
.journeyTitle span{width:4px;height:12px;background:#eaf4ff;border-radius:2px;border-left:2px solid #258cf0}
.journeyFields{display:grid;grid-template-columns:2.35fr 1fr 1fr 1fr 1.04fr;gap:11px}
.journeyField{height:58px;border:1px solid #e0e9f2;border-radius:12px;background:rgba(255,255,255,.78);display:flex;align-items:center;gap:12px;padding:10px 14px;position:relative}
.journeyField.wide{padding-left:14px}
.jfIcon{width:22px;height:22px;display:grid;place-items:center;color:#0e7df0;font-size:20px;flex:none}
.journeyField b{display:block;font-size:12px;color:#5b6e85;margin-bottom:4px}
.journeyField small{display:block;font-size:11px;color:#8ea0b3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.journeyField i{position:absolute;right:12px;font-style:normal;color:#6d8196;font-size:17px}
.generateBtn{height:58px;border-radius:12px;border:0;font-size:12px;font-weight:800;white-space:nowrap}
.refSection{max-width:1555px;width:calc(100% - 12.4vw);margin:143px auto 0}
.refSectionHead{display:flex;gap:14px;align-items:flex-start;margin-bottom:17px}
.refSectionHead>span{width:5px;height:24px;border-radius:4px;background:#1688ef;box-shadow:0 0 10px rgba(22,136,239,.15);margin-top:2px}
.refSectionHead h2{margin:0;color:#0b1c2f;font-size:25px;letter-spacing:-.04em;font-weight:850}
.refSectionHead p{margin:4px 0 0;color:#60758e;font-size:12px}
.refFeatureGrid{display:grid;grid-template-columns:repeat(8,1fr);gap:14px}
.refFeature{height:103px;border:1px solid #dfe8f1;border-radius:14px;background:rgba(255,255,255,.78);box-shadow:0 10px 25px rgba(48,89,121,.045);display:flex;align-items:flex-start;gap:11px;padding:15px 13px;text-align:left;color:#17324d}
.refFeature:hover{transform:translateY(-2px);box-shadow:0 14px 30px rgba(48,89,121,.08)}
.refIcon{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;font-size:21px;flex:none}

function localQuickSolve(q){
  const ql=q.toLowerCase();
  if(/allerg|peanut|nut|pork|beef|vegetarian|vegan|spicy|chili|menu|eat|food/.test(ql)) return ["🍜 Food problem","Open Food → filter ingredients/spice → analyze the menu or show the order card."];
  if(/taxi|driver|car|ride|route|metro|subway|station|airport transfer/.test(ql)) return ["🚕 Transport problem","Open Move → enter the destination → use Driver card. For exact live routes or departures, verify in the city/operator app."];
  if(/hotel|check.?in|room|accommodation/.test(ql)) return ["🏨 Hotel problem","Open Talk for a check-in phrase, and use My China Card above to keep your hotel name and Chinese address ready to show."];
  if(/pay|alipay|wechat|payment|qr|card|cash/.test(ql)) return ["💳 Payment problem","Open Pay → follow the setup checklist → keep a physical card or cash backup if a mobile payment fails."];
  if(/chinese|say|phrase|language|speak|translate/.test(ql)) return ["🗣️ Language problem","Open Talk → describe what you need → create a phrase you can show to a local."];
  if(/train|railway|ticket|station/.test(ql)) return ["🚆 Train problem","Keep your passport and train number ready. Open Talk for a phrase such as “请问在哪里检票？” and confirm station details on the operator app."];
  if(/toilet|restroom|bathroom|washroom/.test(ql)) return ["🚻 Restroom problem","Open Talk and use “请问卫生间在哪里？” — Where is the restroom?"];
  if(/pharmacy|medicine|drug|chemist/.test(ql)) return ["💊 Pharmacy problem","Open Life for the pharmacy guide. Show the exact medicine name to a pharmacist; for urgent medical needs use Help."];
  if(/sim|esim|phone|mobile data|roaming/.test(ql)) return ["📶 SIM / eSIM problem","Open Life for the connectivity checklist and keep the phone number that can receive verification messages."];
  if(/delivery|meituan|package|courier/.test(ql)) return ["📦 Delivery problem","Open Life for delivery/courier guidance. Keep your hotel Chinese address ready in My China Card."];
  if(/help|police|doctor|hospital|emergency|lost passport/.test(ql)) return ["🆘 Need help","Open Help for emergency numbers and ready-to-show Chinese phrases."];
  return ["ChinaGo quick solve","Start with Food, Move, Talk, Pay or Life. If you describe the exact problem, ChinaGo can route it to the most relevant tool."];
}
function solveCommand(){
  const q=($("#commandInput")||{}).value?.trim();
  if(!q)return toast("Describe the problem first");
  const box=$("#commandAnswer");box.innerHTML='<div class="answerCard"><b>ChinaGo is working on it…</b>Finding the most practical next step.</div>';
  api("/api/chat",{method:"POST",body:JSON.stringify({message:q,context:{product:"ChinaGo Everyday China Companion",city:localStorage.getItem("cg_city")||"Beijing"}})})
  .then(d=>{box.innerHTML='<div class="answerCard"><b>Next steps</b>'+esc(d.answer||"Use one of the tools below.")+'</div>'})
  .catch(()=>{const [title,local]=localQuickSolve(q);box.innerHTML='<div class="answerCard"><b>'+title+'</b>'+esc(local)+'</div>'});

function selectService(id){serviceState.id=id;serviceState.results=null;render();window.scrollTo({top:0,behavior:"smooth"})}
async function loadServiceStatus(){try{serviceState.status=await api("/api/services")}catch{serviceState.status=null}}
async function checkService(id){
 serviceState.id=id;
 const payload={city:serviceState.city,date:serviceState.date,party_size:Number(serviceState.pax)||1};
 const box=$("#serviceResults");if(box)box.innerHTML='<div class="serviceResult">Checking connected provider…</div>';
 try{const d=await api("/api/service-search",{method:"POST",body:JSON.stringify({serviceId:id,payload})});serviceState.results=d;if(box)renderServiceResults()}
 catch(e){if(box)box.innerHTML='<div class="serviceResult"><b>Provider check unavailable</b>'+esc(e.message)+'</div>'}
}
function renderServiceResults(){
 const box=$("#serviceResults");if(!box)return;
 const d=serviceState.results||{};
 if(!d.configured){box.innerHTML='<div class="serviceResult"><b>Request-based service</b>'+esc(d.message||"No live supplier is connected yet. You can still send a request to ChinaGo.")+'</div>';return}
 const items=Array.isArray(d.items)?d.items:[];
 if(!items.length){box.innerHTML='<div class="serviceResult"><b>Provider connected</b>No matching live items were returned. Send a request and ChinaGo can follow up.</div>';return}
 box.innerHTML=items.slice(0,6).map((x,i)=>'<div class="serviceResult"><b>'+esc(x.title||x.name||x.hotel_name||("Option "+(i+1)))+'</b>'+esc(x.description||x.summary||x.price_text||"Provider result returned; confirm final price and terms before purchase.")+'</div>').join("");
}
async function submitServiceRequest(){
 const details=$("#serviceDetails")?.value.trim()||"";
 const contact=$("#serviceContact")?.value.trim()||"";
 if(!details){toast("Describe what you need first");return}
 serviceState.details=details;
 const svc=SERVICE_CATALOG.find(x=>x.id===serviceState.id)||SERVICE_CATALOG[0];
 try{
  const d=await api("/api/booking-leads",{method:"POST",body:JSON.stringify({category:svc.kind,offer_id:serviceState.id,customer_email:contact,travel_date:serviceState.date||null,party_size:Number(serviceState.pax)||1,request_json:{service_id:serviceState.id,service_title:svc.title,city:serviceState.city,details}})});
  const box=$("#serviceResults");
  if(box)box.innerHTML='<div class="serviceSuccess"><b>Request received.</b> '+esc(d.lead_id?"Reference: "+d.lead_id:"ChinaGo request saved.")+'<br>We will only treat it as booked after a real provider confirms it.</div>';
  toast("Request sent");
 }catch(e){toast("Could not send request: "+e.message)}
}

function more(){return toolHero("＋ More","Travel planning and booking remain available, but they are supporting features rather than the center of ChinaGo.")+'<div class="moreList"><div class="moreItem"><div><h3>🧳 ChinaGo Services</h3><p>Airport transfer, driver, hotel help, translation and local assistance.</p></div><button class="primary" onclick="go(\'services\')">Open</button></div><div class="moreItem"><div><h3>✦ Trip Planner</h3><p>Build a multi-day China itinerary when you actually need one.</p></div><button class="primary" onclick="goPlan()">Open</button></div><div class="moreItem"><div><h3>🏨 Hotels</h3><p>Live hotel search is available when the Booking.com provider is connected.</p></div><button class="primary" onclick="hotelHelp()">Open</button></div><div class="moreItem"><div><h3>◌ AI Assistant</h3><p>Ask ChinaGo a practical China question.</p></div><button class="primary" onclick="goChat()">Open</button></div></div>'}
function goPlan(){toast("Trip Planner is retained as a secondary module. The new core tools are Food, Move, Talk, Pay and Life.")}
function hotelHelp(){toast("Hotel search requires a connected provider. Use the hotel/booking flow when credentials are configured.")}
function goChat(){const box='<section class="panel chat"><div class="messages" id="messages">'+state.chat.map(m=>'<div class="bubble '+m.role+'">'+esc(m.text)+'</div>').join("")+'</div><div class="chatBar"><input id="chatInput" placeholder="Ask about China…"/><button class="primary" onclick="sendChat()">Send</button></div></section>';app.innerHTML=nav()+'<main class="shell">'+toolHero("◌ ChinaGo Assistant","Practical China help. Current facts should be verified live.")+box+"</main>"+bottom();setTimeout(()=>$("#chatInput")?.focus(),50)}
async function sendChat(){const input=$("#chatInput");const q=input?.value.trim();if(!q||state.chatLoading)return;state.chat.push({role:"user",text:q});state.chatLoading=true;goChat();try{const d=await api("/api/chat",{method:"POST",body:JSON.stringify({message:q,context:{product:"ChinaGo Survival OS"}})});state.chat.push({role:"ai",text:d.answer||"I couldn't answer that."})}catch(e){state.chat.push({role:"ai",text:"I couldn't reach the assistant. Try one of the practical tools instead."})}state.chatLoading=false;goChat()}
async function api(path,opt={}){if(STATIC_MODE){if(path==="/api/chat")return {answer:"Offline ChinaGo mode: use the Food, Move, Talk, Pay and Life tools without a server. Current information needs server mode.",mode:"static"};if(path==="/api/live-search")return {answer:"Live search needs ChinaGo server mode.",mode:"static"};return {ok:true}}const r=await fetch(path,{headers:{"Content-Type":"application/json",...(opt.headers||{})},...opt});let d;try{d=await r.json()}catch{throw new Error("Server returned "+r.status)}if(!r.ok)throw new Error(d.error||"Request failed");return d}
