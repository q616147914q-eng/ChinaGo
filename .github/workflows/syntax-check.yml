name: ChinaGo syntax check

on:
  push:
    branches: ["main"]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract browser script
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path("public/index.html").read_text(encoding="utf-8")
          m=re.search(r"<script[^>]*>(.*)</script>", s, re.I)
          if not m: raise SystemExit("script not found")
          Path("/tmp/chinago.js").write_text(m.group(1), encoding="utf-8")
          PY
      - name: Node syntax check
        run: node --check /tmp/chinago.js
