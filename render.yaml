services:
  - type: web
    name: chinago
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-5.6-luna
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: BOOKING_COM_API_BASE
        value: https://demandapi.booking.com/3.2
      - key: BOOKING_COM_API_KEY
        sync: false
      - key: BOOKING_COM_AFFILIATE_ID
        sync: false
      - key: BOOKING_COM_ENABLE_SMART_SEARCH
        value: "true"
      - key: BOOKING_COM_DEFAULT_BOOKER_COUNTRY
        value: gb
      - key: ADMIN_EMAILS
        sync: false
